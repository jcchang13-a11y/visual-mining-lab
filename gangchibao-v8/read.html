<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剛吃飽｜第八版</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#181818;font-family:"Noto Serif TC","PMingLiU",serif}.shell{max-width:760px;margin:auto;padding:18px 16px 70px}.head{padding:18px 0 16px;border-bottom:1px solid #aaa}.kicker{font:12px/1.4 system-ui,sans-serif;letter-spacing:.12em;color:#666}.head h1{font-size:clamp(32px,9vw,58px);font-weight:500;margin:5px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.controls button,.controls select,.controls a{font:14px/1 system-ui,sans-serif;border:1px solid #999;background:#faf8f1;color:#181818;padding:10px 12px;text-decoration:none;border-radius:0}.controls button:disabled{opacity:.35}.status{font:12px/1.5 system-ui,sans-serif;color:#666;margin:12px 0 0}.paper{margin-top:20px;background:#fffdf7;border:1px solid #bbb;padding:clamp(20px,5vw,42px);font-size:17px;line-height:1.95;overflow-wrap:anywhere}.paper h2{font-size:24px;font-weight:500;margin:0 0 24px;padding-bottom:10px;border-bottom:1px solid #ccc}.line{white-space:pre-wrap}.blank{height:.9em}.structure{font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;color:#777;border-left:2px solid #bbb;padding-left:10px;margin:10px 0}.sutra{margin:20px 0;padding:16px 18px;border-top:1px solid #888;border-bottom:1px solid #888;background:#f7f3e8}.work{margin:16px 0;padding:12px 14px;border:1px dashed #aaa;background:#f1eee6;font-family:system-ui,sans-serif;font-size:14px;line-height:1.75}.figure-slot{margin:20px 0;padding:12px;border:1px dotted #999}.error{font-family:system-ui,sans-serif;color:#7b1b1b}.foot{font:12px/1.7 system-ui,sans-serif;color:#777;margin-top:20px}@media print{@page{size:110mm 190mm;margin:13mm 11mm 15mm}.shell{max-width:none;padding:0}.head,.controls,.status,.foot{display:none}.paper{border:0;margin:0;padding:0;font-size:10.5pt;line-height:1.72}.sutra,.work,.structure,.figure-slot{break-inside:avoid}}
</style>
</head>
<body><main class="shell">
<header class="head"><div class="kicker">《剛吃飽》第八版｜爛尾樓版｜NEW READER</div><h1>剛吃飽</h1><div class="controls"><button id="prev">← 上一單元</button><select id="picker" aria-label="選擇單元"></select><button id="next">下一單元 →</button><a href="index.html">目錄</a></div><div class="status" id="status">讀取中……</div></header>
<article class="paper" id="article"><div>讀取中……</div></article>
<div class="foot">這是重新製作的獨立閱讀器。它直接讀取第八版既有 unit Markdown，不依賴舊 reader-live.html。</div>
</main>
<script>
const units=['30000','30210','30220','30230','30240B','30250','30260B','30270B','30280B','30310B','30320','30330','30340','30350A','30360','30370','30380','30390','30410A','30430','30440','30450'];
const picker=document.querySelector('#picker'),article=document.querySelector('#article'),status=document.querySelector('#status');
units.forEach((u,i)=>{const o=document.createElement('option');o.value=u;o.textContent=String(i+1).padStart(2,'0')+' · '+u;picker.append(o)});
function wanted(){const p=new URLSearchParams(location.search).get('u');return units.includes(p)?p:units[0]}
function addText(parent,text,cls='line'){const d=document.createElement('div');d.className=cls;d.textContent=text;parent.append(d)}
function render(md,u){article.textContent='';const title=document.createElement('h2');title.textContent='單元 '+String(units.indexOf(u)+1).padStart(2,'0')+' · '+u;article.append(title);let box=null,mode='';for(const raw of md.replace(/^\uFEFF/,'').split(/\r?\n/)){const open=raw.match(/^\s*\[\[(SUTRA|WORK|FIGURE)(?::\s*(.*?))?\]\]\s*$/i),close=raw.match(/^\s*\[\[\/(SUTRA|WORK|FIGURE)\]\]\s*$/i);if(open){mode=open[1].toUpperCase();box=document.createElement('section');box.className=mode==='SUTRA'?'sutra':mode==='WORK'?'work':'figure-slot';if(open[2])addText(box,open[2],'structure');article.append(box);continue}if(close){box=null;mode='';continue}const target=box||article;if(raw===''){const b=document.createElement('div');b.className='blank';target.append(b)}else if(/^\s*\[\[.*\]\]\s*$/.test(raw)||/^\s*(S|P|L|N|F)\s*[:：]/.test(raw)){addText(target,raw,'structure')}else addText(target,raw)} }
async function load(u,push=false){const i=units.indexOf(u);picker.value=u;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===units.length-1;status.textContent='讀取單元 '+String(i+1).padStart(2,'0')+'／22……';if(push)history.pushState({},'',location.pathname+'?u='+encodeURIComponent(u));try{const r=await fetch('unit-'+u+'.md?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const md=await r.text();render(md,u);status.textContent='第 '+String(i+1).padStart(2,'0')+'／22 單元 · 原始 Markdown 直讀';scrollTo({top:0,behavior:'instant'})}catch(e){article.innerHTML='';addText(article,'讀取失敗：'+e.message,'error');status.textContent='讀取失敗'}}
picker.onchange=()=>load(picker.value,true);document.querySelector('#prev').onclick=()=>{const i=units.indexOf(picker.value);if(i>0)load(units[i-1],true)};document.querySelector('#next').onclick=()=>{const i=units.indexOf(picker.value);if(i<units.length-1)load(units[i+1],true)};addEventListener('popstate',()=>load(wanted(),false));load(wanted(),false);
</script></body></html>
