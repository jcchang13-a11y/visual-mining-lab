<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>剛吃飽｜第八版</title>
<style>
*{box-sizing:border-box}html{background:#f5f2e9}body{margin:0;color:#211f1a;font-family:"Noto Serif TC","Songti TC","PMingLiU","Times New Roman",serif}.book{width:min(100%,680px);margin:0 auto;padding:0 24px 96px}.mast{padding:42px 0 20px;text-align:center}.mast .edition{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.18em;color:#777}.mast h1{margin:10px 0 3px;font-size:clamp(34px,8vw,52px);font-weight:500;letter-spacing:.08em}.mast .unitno{font-size:13px;color:#777}.reader{font-size:18px;line-height:2.05;letter-spacing:.035em}.reader h2{font-size:21px;font-weight:500;text-align:center;margin:38px 0 42px;letter-spacing:.08em}.line{white-space:pre-wrap}.blank{height:1.15em}.structure{margin:18px -6px;padding:7px 10px;border-left:1px solid #aaa;color:#777;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;letter-spacing:0}.sutra{margin:30px 0;padding:20px 4px;border-top:1px solid #aaa;border-bottom:1px solid #aaa;font-size:17px;line-height:2.15}.work{margin:26px -10px;padding:15px 18px;background:#ece8dd;font-family:system-ui,sans-serif;font-size:14px;line-height:1.85;letter-spacing:0}.figure-slot{margin:30px 0;padding:12px 0;border-top:1px dotted #aaa;border-bottom:1px dotted #aaa}.dock{position:sticky;bottom:0;margin:56px -8px 0;padding:10px 8px 14px;background:linear-gradient(to bottom,rgba(245,242,233,0),#f5f2e9 25%);font-family:system-ui,sans-serif}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:18px}.nav button,.nav select,.nav a{border:0;background:transparent;color:#555;font:13px/1.2 system-ui,sans-serif;text-decoration:none;padding:8px 4px}.nav button{cursor:pointer}.nav button:disabled{opacity:.2}.nav select{max-width:150px;text-align:center}.status{text-align:center;font:10px/1.4 system-ui,sans-serif;color:#999;margin-top:3px}.error{font-family:system-ui,sans-serif;color:#7b1b1b}@media(max-width:520px){.book{padding-left:20px;padding-right:20px}.mast{padding-top:30px}.reader{font-size:17px;line-height:2}.work{margin-left:-4px;margin-right:-4px}.dock{margin-left:-4px;margin-right:-4px}}@media print{@page{size:110mm 190mm;margin:13mm 11mm 15mm}.book{width:auto;padding:0}.mast,.dock{display:none}.reader{font-size:10.5pt;line-height:1.72;letter-spacing:0}.reader h2{margin-top:0}.sutra,.work,.structure,.figure-slot{break-inside:avoid}}
</style>
</head>
<body><main class="book"><header class="mast"><div class="edition">《剛吃飽》　第八版・爛尾樓版</div><h1>剛吃飽</h1><div class="unitno" id="unitno"></div></header><article class="reader" id="article">讀取中……</article><footer class="dock"><nav class="nav"><button id="prev">← 前</button><select id="picker" aria-label="選擇單元"></select><a href="index.html">目錄</a><button id="next">後 →</button></nav><div class="status" id="status"></div></footer></main>
<script>
const units=['30000','30210','30220','30230','30240B','30250','30260B','30270B','30280B','30310B','30320','30330','30340','30350A','30360','30370','30380','30390','30410A','30430','30440','30450'];
const picker=document.querySelector('#picker'),article=document.querySelector('#article'),status=document.querySelector('#status'),unitno=document.querySelector('#unitno');
units.forEach((u,i)=>{const o=document.createElement('option');o.value=u;o.textContent=String(i+1).padStart(2,'0')+' ／ 22';picker.append(o)});
function wanted(){const p=new URLSearchParams(location.search).get('u');return units.includes(p)?p:units[0]}
function addText(parent,text,cls='line'){const d=document.createElement('div');d.className=cls;d.textContent=text;parent.append(d)}
function render(md,u){article.textContent='';const n=String(units.indexOf(u)+1).padStart(2,'0');unitno.textContent=n+' ／ 22';const title=document.createElement('h2');title.textContent='單元 '+n;article.append(title);let box=null;let firstSutraText=[];let skipOpeningDuplicate=false;let duplicateCursor=0;for(const raw of md.replace(/^\uFEFF/,'').split(/\r?\n/)){const open=raw.match(/^\s*\[\[(SUTRA|WORK|FIGURE)(?::\s*(.*?))?\]\]\s*$/i),close=raw.match(/^\s*\[\[\/(SUTRA|WORK|FIGURE)\]\]\s*$/i);if(open){const mode=open[1].toUpperCase();box=document.createElement('section');box.className=mode==='SUTRA'?'sutra':mode==='WORK'?'work':'figure-slot';if(mode==='SUTRA'&&u==='30000'&&!firstSutraText.length)box.dataset.captureOpening='1';if(open[2])addText(box,open[2],'structure');article.append(box);continue}if(close){if(box?.dataset.captureOpening==='1'){firstSutraText=[...box.querySelectorAll('.line')].map(x=>x.textContent).filter(Boolean);skipOpeningDuplicate=u==='30000'&&firstSutraText.length>0;duplicateCursor=0}box=null;continue}if(skipOpeningDuplicate&&!box){if(raw==='')continue;if(duplicateCursor<firstSutraText.length&&raw===firstSutraText[duplicateCursor]){duplicateCursor++;continue}if(duplicateCursor>0&&duplicateCursor<firstSutraText.length){skipOpeningDuplicate=false;duplicateCursor=0}else if(duplicateCursor===firstSutraText.length){skipOpeningDuplicate=false;duplicateCursor=0}}
const target=box||article;if(raw===''){const b=document.createElement('div');b.className='blank';target.append(b)}else if(/^\s*\[\[.*\]\]\s*$/.test(raw)||/^\s*(S|P|L|N|F)\s*[:：]/.test(raw)){addText(target,raw,'structure')}else addText(target,raw)} }
async function load(u,push=false){const i=units.indexOf(u);picker.value=u;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===units.length-1;status.textContent='讀取中';if(push)history.pushState({},'',location.pathname+'?u='+encodeURIComponent(u));try{const r=await fetch('unit-'+u+'.md?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);render(await r.text(),u);status.textContent='第 '+String(i+1).padStart(2,'0')+' 單元';scrollTo({top:0,behavior:'instant'})}catch(e){article.innerHTML='';addText(article,'讀取失敗：'+e.message,'error');status.textContent='讀取失敗'}}
picker.onchange=()=>load(picker.value,true);document.querySelector('#prev').onclick=()=>{const i=units.indexOf(picker.value);if(i>0)load(units[i-1],true)};document.querySelector('#next').onclick=()=>{const i=units.indexOf(picker.value);if(i<units.length-1)load(units[i+1],true)};addEventListener('popstate',()=>load(wanted(),false));load(wanted(),false);
</script></body></html>
