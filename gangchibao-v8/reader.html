'30210':`[[SUTRA: 本單元涉及經文｜善現啟請分第二／大乘正宗分第三]]
【善現啟請分第二】
時，長老須菩提，在大眾中，即從座起，偏袒右肩，右膝著地，合掌恭敬，而白佛言：「希有，世尊！如來善護念諸菩薩，善付囑諸菩薩。世尊，善男子、善女人，發阿耨多羅三藐三菩提心，應云何住？云何降伏其心？」

佛言：「善哉，善哉！須菩提，如汝所說：『如來善護念諸菩薩，善付囑諸菩薩。』汝今諦聽，當為汝說：『善男子、善女人，發阿耨多羅三藐三菩提心，應如是住，如是降伏其心。』」

「唯然，世尊。願樂欲聞。」

【大乘正宗分第三】
佛告須菩提：「諸菩薩摩訶薩應如是降伏其心：所有一切眾生之類，若卵生，若胎生，若濕生，若化生；若有色，若無色；若有想，若無想，若非有想非無想，我皆令入無餘涅槃而滅度之。如是滅度無量無數無邊眾生，實無眾生得滅度者。何以故？須菩提，若菩薩有我相、人相、眾生相、壽者相，即非菩薩。」
[[/SUTRA]]`,
'30220':`[[SUTRA: 本單元涉及經文｜妙行無住分第四]]
【妙行無住分第四】
「復次，須菩提，菩薩於法，應無所住，行於布施。所謂不住色布施，不住聲、香、味、觸、法布施。

須菩提，菩薩應如是布施，不住於相。何以故？若菩薩不住相布施，其福德不可思量。

須菩提，於意云何？東方虛空可思量不？」

「不也，世尊。」

「須菩提，南西北方、四維、上下虛空，可思量不？」

「不也，世尊。」

「須菩提，菩薩無住相布施，福德亦復如是不可思量。須菩提，菩薩但應如所教住。」
[[/SUTRA]]`,
'30230':`[[SUTRA: 本單元涉及經文｜如理實見分第五]]
【如理實見分第五】
「須菩提，於意云何？可以身相見如來不？」

「不也，世尊。不可以身相得見如來。何以故？如來所說身相，即非身相。」

佛告須菩提：「凡所有相，皆是虛妄。若見諸相非相，則見如來。」
[[/SUTRA]]`,
'30240B':`[[SUTRA: 本單元涉及經文｜正信希有分第六]]
【正信希有分第六】
須菩提白佛言：「世尊，頗有眾生，得聞如是言說章句，生實信不？」

佛告須菩提：「莫作是說。如來滅後，後五百歲，有持戒修福者，於此章句，能生信心，以此為實。當知是人，不於一佛二佛三四五佛而種善根，已於無量千萬佛所種諸善根。聞是章句，乃至一念生淨信者，須菩提，如來悉知悉見，是諸眾生得如是無量福德。

何以故？是諸眾生無復我相、人相、眾生相、壽者相；無法相，亦無非法相。何以故？是諸眾生若心取相，則為著我、人、眾生、壽者。

若取法相，即著我、人、眾生、壽者。何以故？若取非法相，即著我、人、眾生、壽者。是故不應取法，不應取非法。

以是義故，如來常說：汝等比丘，知我說法，如筏喻者；法尚應捨，何況非法。」
[[/SUTRA]]`,
'30250':`[[SUTRA: 本單元涉及經文｜無得無說分第七]]
【無得無說分第七】
「須菩提，於意云何？如來得阿耨多羅三藐三菩提耶？如來有所說法耶？」

須菩提言：「如我解佛所說義，無有定法名阿耨多羅三藐三菩提，亦無有定法如來可說。何以故？如來所說法，皆不可取、不可說、非法、非非法。所以者何？一切賢聖皆以無為法而有差別。」
[[/SUTRA]]`,
'30260B':`[[SUTRA: 本單元涉及經文｜依法出生分第八]]
【依法出生分第八】
「須菩提，於意云何？若人滿三千大千世界七寶，以用布施，是人所得福德，寧為多不？」

須菩提言：「甚多，世尊。何以故？是福德即非福德性，是故如來說福德多。」

「若復有人，於此經中受持乃至四句偈等，為他人說，其福勝彼。何以故？須菩提，一切諸佛，及諸佛阿耨多羅三藐三菩提法，皆從此經出。須菩提，所謂佛法者，即非佛法。」
[[/SUTRA]]`,
'30270B':`[[SUTRA: 本單元涉及經文｜一相無相分第九]]
【一相無相分第九】
「須菩提，於意云何？須陀洹能作是念：我得須陀洹果不？」

須菩提言：「不也，世尊。何以故？須陀洹名為入流，而無所入。不入色、聲、香、味、觸、法，是名須陀洹。」

「須菩提，於意云何？斯陀含能作是念：我得斯陀含果不？」

須菩提言：「不也，世尊。何以故？斯陀含名一往來，而實無往來，是名斯陀含。」

「須菩提，於意云何？阿那含能作是念：我得阿那含果不？」

須菩提言：「不也，世尊。何以故？阿那含名為不來，而實無不來，是故名阿那含。」

「須菩提，於意云何？阿羅漢能作是念：我得阿羅漢道不？」

須菩提言：「不也，世尊。何以故？實無有法名阿羅漢。世尊，若阿羅漢作是念：我得阿羅漢道，即為著我、人、眾生、壽者。

世尊，佛說我得無諍三昧，人中最為第一，是第一離欲阿羅漢。我不作是念：我是離欲阿羅漢。世尊，我若作是念：我得阿羅漢道，世尊則不說須菩提是樂阿蘭那行者。以須菩提實無所行，而名須菩提是樂阿蘭那行。」
