<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>剛吃飽｜第八版｜爛尾樓版</title><style>body{margin:0;background:#f4f1e8;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:860px;margin:auto;padding:28px 20px 64px}.top{border-bottom:1px solid #bbb;padding-bottom:16px;margin-bottom:28px}.eyebrow{font-size:.74rem;letter-spacing:.14em;color:#777}.top h1{font-size:clamp(2rem,7vw,4rem);margin:.12em 0}.status{font-weight:700}.nav{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}.nav a{color:inherit;text-decoration:none;font-weight:700}.article{background:#fffdf6;border:1px solid #c9c4b8;padding:clamp(18px,4vw,34px);line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}.footer{margin-top:28px;color:#777;font-size:.86rem}.back{margin-bottom:12px}a{color:inherit}.gcb-formula{display:inline-grid;grid-template-rows:auto 1px auto;justify-items:center;align-items:center;vertical-align:middle;white-space:nowrap;line-height:1.15;margin:.18em .16em;padding:.06em .18em;font-family:inherit;font-weight:600}.gcb-formula .gcb-name{padding:0 .28em .12em}.gcb-formula .gcb-bar{width:100%;min-width:2.2em;height:1px;background:currentColor}.gcb-formula .gcb-neg{padding:.12em .28em 0}.gcb-formula.block{display:grid;width:max-content;max-width:100%;margin:.8em auto;font-size:1.08em}</style></head><body><main class="wrap"><div class="back"><a href="index.html">← 22 單元目錄</a></div><section class="top"><div class="eyebrow">《剛吃飽》 · 第八版 · 爛尾樓版</div><h1 id="unitTitle">讀取中</h1><div class="status" id="status"></div><div class="nav" id="nav"></div></section><article class="article" id="article">讀取中……</article><div class="footer">爛尾樓版公式規格：基本式固定為 S = ～S；名稱層次以 {{S}} 生成上層「S」／下層～S 的直式公式。施工痕跡、岔路、返工與未閉合斷面不因未完成而清除。</div></main><script>const units=['30000','30210','30220','30230','30240B','30250','30260B','30270B','30280B','30310B','30320','30330','30340','30350A','30360','30370','30380','30390','30410A','30430','30440','30450'];const p=new URLSearchParams(location.search);let u=p.get('u')||units[0];let i=units.indexOf(u);if(i<0){i=0;u=units[0]}document.getElementById('unitTitle').textContent=u;document.getElementById('status').textContent=`單元 ${String(i+1).padStart(2,'0')} / 22`;const nav=document.getElementById('nav');if(i>0)nav.innerHTML+=`<a href="reader.html?u=${units[i-1]}">← ${units[i-1]}</a>`;if(i<units.length-1)nav.innerHTML+=`<a href="reader.html?u=${units[i+1]}">${units[i+1]} →</a>`;
function makeFormula(label,block=false){const f=document.createElement('span');f.className='gcb-formula'+(block?' block':'');const n=document.createElement('span');n.className='gcb-name';n.textContent=`「${label}」`;const b=document.createElement('span');b.className='gcb-bar';const d=document.createElement('span');d.className='gcb-neg';d.textContent=`～${label}`;f.append(n,b,d);return f}
function renderArticle(text){const article=document.getElementById('article');article.textContent='';const lines=text.split('\n');lines.forEach((line,idx)=>{const active=line.match(/^\s*>\s*([^=\n]+?)\s*=\s*～\s*([^\n]+?)\s*$/);if(active&&active[1].trim()===active[2].trim()){article.append(makeFormula(active[1].trim(),true));}else{const re=/\{\{([^{}\n]+)\}\}/g;let last=0,m;while((m=re.exec(line))){if(m.index>last)article.append(document.createTextNode(line.slice(last,m.index)));article.append(makeFormula(m[1].trim(),line.trim()===m[0]));last=re.lastIndex}if(last<line.length)article.append(document.createTextNode(line.slice(last)));}if(idx<lines.length-1)article.append(document.createTextNode('\n'))})}
fetch(`unit-${u}.md?v=20260901-formula-standard`).then(r=>{if(!r.ok)throw new Error('正文檔案不存在');return r.text()}).then(t=>{let lines=t.replace(/^\uFEFF/,'').split(/\r?\n/);let removed=false;for(let n=0;n<Math.min(lines.length,6);n++){if(!removed&&/^\s*\[\[.*\]\]\s*$/.test(lines[n])){lines.splice(n,1);removed=true;break}}renderArticle(lines.join('\n').replace(/^\s+/,''));}).catch(e=>{document.getElementById('article').textContent='讀取失敗：'+e.message});</script></body></html>
