<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">第十五分回溯第十三、第十一、第八分</title>
  <desc id="desc">黑白極簡同心圓。中心為第十五分，外圈依回溯層次標示第十三分、第十一分、第八分，表示「為人說／為人解說」與福德比較線被再次叫回。</desc>
  <rect width="360" height="360" fill="#fff"/>
  <circle cx="180" cy="180" r="150" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="112" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="76" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="42" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="174" text-anchor="middle" font-family="serif" font-size="18" fill="#111">第十五分</text>
  <text x="180" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">15</text>
  <text x="180" y="114" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第十三分</text>
  <text x="180" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">13</text>
  <text x="180" y="76" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第十一分</text>
  <text x="180" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">11</text>
  <text x="180" y="38" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第八分</text>
  <text x="180" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">8</text>
</svg>
