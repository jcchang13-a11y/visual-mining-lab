<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">第十五分回溯第十四、第十三分</title>
  <desc id="desc">黑白極簡同心圓。中心為第十五分，外圈依回溯層次標示第十四分、第十三分，表示本單元把身布施與此經受持的比較線重新收回前兩分。</desc>
  <rect width="360" height="360" fill="#fff"/>
  <circle cx="180" cy="180" r="132" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="86" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="42" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="174" text-anchor="middle" font-family="serif" font-size="18" fill="#111">第十五分</text>
  <text x="180" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">15</text>
  <text x="180" y="115" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第十四分</text>
  <text x="180" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">14</text>
  <text x="180" y="69" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第十三分</text>
  <text x="180" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">13</text>
</svg>
