<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">第三十二分聞法收束回第一分</title>
  <desc id="desc">第三十二分「聞佛所說，皆大歡喜，信受奉行」回扣第一分「如是我聞」：全經從聞開始，也從聞收束。</desc>
  <rect width="360" height="360" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <circle cx="180" cy="180" r="72"/>
    <circle cx="180" cy="180" r="144"/>
  </g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle">
    <text x="180" y="180">32</text>
    <text x="180" y="48">1</text>
  </g>
</svg>
