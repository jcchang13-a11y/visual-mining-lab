<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">最後清場總覽由第三十分回看前段宇宙尺度史</title>
  <desc id="desc">總覽第二個藏身處明確重新叫回三千大千世界、恆河沙世界、須彌山王與七寶布施，將第三十分世界與微塵的拆解接回第十一、第十與第八分的尺度放大歷史。</desc>
  <rect width="320" height="320" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <circle cx="160" cy="160" r="34"/>
    <circle cx="160" cy="160" r="72"/>
    <circle cx="160" cy="160" r="110"/>
    <circle cx="160" cy="160" r="148"/>
  </g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">
    <text x="160" y="160">30</text>
    <text x="160" y="106">11</text>
    <text x="160" y="68">10</text>
    <text x="160" y="30">8</text>
  </g>
</svg>
