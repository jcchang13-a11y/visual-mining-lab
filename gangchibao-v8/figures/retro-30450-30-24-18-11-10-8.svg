    <circle cx="190" cy="190" r="82"/>
    <circle cx="190" cy="190" r="106"/>
    <circle cx="190" cy="190" r="130"/>
    <circle cx="190" cy="190" r="154"/>
  </g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle">
    <text x="190" y="190">30</text>
    <text x="190" y="144">24</text>
    <text x="190" y="120">18</text>
    <text x="190" y="96">11</text>
