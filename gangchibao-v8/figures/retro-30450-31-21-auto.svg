<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-labelledby="title desc"><title id="title">第三十一分回溯第二十一分</title><desc id="desc">第三十一分的取相問題直接對照第二十一分說法者無法可說，是名說法：一端拆所說，一端拆觀看。</desc><rect width="620" height="620" fill="white"/><g fill="none" stroke="black" stroke-width="2"><circle cx="310" cy="310" r="110"/><circle cx="310" cy="310" r="230"/></g><g fill="black" font-family="system-ui,sans-serif" font-size="26" text-anchor="middle"><text x="310" y="319">31</text><text x="310" y="93">21</text></g></svg>