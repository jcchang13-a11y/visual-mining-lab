<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="title desc">
  <title id="title">第三十二分聞法散場回扣第一分如是我聞</title>
  <desc id="desc">第三十二分以聞佛所說、信受奉行收束，結構性回扣第一分如是我聞與飯後開場；全經從聞開始，也從聞收束。</desc>
  <rect width="260" height="260" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <circle cx="130" cy="130" r="38"/>
    <circle cx="130" cy="130" r="88"/>
  </g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">
    <text x="130" y="130">32</text>
    <text x="130" y="66">1</text>
  </g>
</svg>
