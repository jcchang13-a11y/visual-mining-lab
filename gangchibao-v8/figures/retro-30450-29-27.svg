<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">第二十九分回溯第二十七分</title>
  <desc id="desc">第二十九分明說不能把無所從來亦無所去讀成取消佛的身體與行動，否則會掉回第二十七分的斷滅相。</desc>
  <rect width="360" height="360" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <circle cx="180" cy="180" r="62"/>
    <circle cx="180" cy="180" r="132"/>
  </g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle">
    <text x="180" y="180">29</text>
    <text x="180" y="68">27</text>
  </g>
</svg>
