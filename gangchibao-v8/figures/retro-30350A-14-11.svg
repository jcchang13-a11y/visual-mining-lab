<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">第十四分回溯第十一分</title>
  <desc id="desc">黑白極簡同心圓。中心為第十四分，外圈為第十一分，表示第十四分再次把受持四句偈、為人說與恆河沙數世界七寶布施放在同一條比較線上。</desc>
  <rect width="320" height="320" fill="#fff"/>
  <circle cx="160" cy="160" r="118" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="160" cy="160" r="50" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="160" y="154" text-anchor="middle" font-family="serif" font-size="18" fill="#111">第十四分</text>
  <text x="160" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">14</text>
  <text x="160" y="55" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第十一分</text>
  <text x="160" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">11</text>
</svg>
