<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">第二十九分回溯第一分</title>
  <desc id="desc">黑白極簡同心圓。中心為第二十九分，外圈為第一分。</desc>
  <rect width="420" height="420" fill="white"/>
  <circle cx="210" cy="210" r="150" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="210" cy="210" r="72" fill="none" stroke="black" stroke-width="2"/>
  <text x="210" y="206" text-anchor="middle" font-family="serif" font-size="24" fill="black">第二十九分</text>
  <text x="210" y="232" text-anchor="middle" font-family="serif" font-size="14" fill="black">當下</text>
  <text x="210" y="76" text-anchor="middle" font-family="serif" font-size="22" fill="black">第一分</text>
</svg>
