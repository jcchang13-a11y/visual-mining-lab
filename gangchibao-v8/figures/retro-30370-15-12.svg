<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">第十五分回溯第十二分</title>
  <desc id="desc">黑白極簡同心圓。中心為第十五分，外圈為第十二分，表示「若有此經／此處則為是塔」重新接回經典所在之處與供養場所的力線。</desc>
  <rect width="360" height="360" fill="#fff"/>
  <circle cx="180" cy="180" r="116" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="54" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="174" text-anchor="middle" font-family="serif" font-size="18" fill="#111">第十五分</text>
  <text x="180" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">15</text>
  <text x="180" y="76" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第十二分</text>
  <text x="180" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">12</text>
</svg>
