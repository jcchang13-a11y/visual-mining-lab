    <circle cx="160" cy="160" r="54"/>
    <circle cx="160" cy="160" r="80"/>
    <circle cx="160" cy="160" r="106"/>
    <circle cx="160" cy="160" r="132"/>
    <circle cx="160" cy="160" r="154"/>
  </g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">
    <text x="160" y="160">27</text>
    <text x="160" y="119">25</text>
    <text x="160" y="93">17</text>
