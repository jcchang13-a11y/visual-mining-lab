<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">第二十七分沿四相歷次出現往前回溯</title>
  <desc id="desc">第二十七分把無我、無人、無眾生、無壽者列入容易被誤讀成斷滅的材料；圖沿第二十五、第十七、第十四、第六、第三分的四相施工史往前回溯。</desc>
