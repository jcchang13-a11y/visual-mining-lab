<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">第十三分回溯第十二、第十一、第十、第八分</title>
  <desc id="desc">黑白極簡同心圓。中心為第十三分，外圈依正文回溯層次標示第十二、第十一、第十、第八分，表示世界與微塵段落回看此前經典現場、恆河沙與世界、須彌山及七寶布施的尺度放大線。</desc>
  <rect width="400" height="400" fill="#fff"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="136" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="103" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="72" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="42" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="200" y="194" text-anchor="middle" font-family="serif" font-size="18" fill="#111">第十三分</text>
  <text x="200" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">13</text>
  <text x="200" y="142" text-anchor="middle" font-family="serif" font-size="15" fill="#111">第十二分</text>
  <text x="200" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">12</text>
  <text x="200" y="109" text-anchor="middle" font-family="serif" font-size="15" fill="#111">第十一分</text>
  <text x="200" y="127" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">11</text>
  <text x="200" y="76" text-anchor="middle" font-family="serif" font-size="15" fill="#111">第十分</text>
  <text x="200" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">10</text>
  <text x="200" y="43" text-anchor="middle" font-family="serif" font-size="15" fill="#111">第八分</text>
  <text x="200" y="61" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">8</text>
</svg>
