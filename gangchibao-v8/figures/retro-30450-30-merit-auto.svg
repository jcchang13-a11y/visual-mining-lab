<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-labelledby="title desc"><title id="title">第三十分回溯世界與福德尺度線</title><desc id="desc">第三十分把前文不斷放大的世界與福德尺度拆成微塵；此處只接回文本明確相鄰的第二十八、第二十四、第十九分。</desc><rect width="620" height="620" fill="white"/><g fill="none" stroke="black" stroke-width="2"><circle cx="310" cy="310" r="58"/><circle cx="310" cy="310" r="122"/><circle cx="310" cy="310" r="186"/><circle cx="310" cy="310" r="250"/></g><g fill="black" font-family="system-ui,sans-serif" font-size="24" text-anchor="middle"><text x="310" y="319">30</text><text x="310" y="202">28</text><text x="310" y="138">24</text><text x="310" y="74">19</text></g></svg>