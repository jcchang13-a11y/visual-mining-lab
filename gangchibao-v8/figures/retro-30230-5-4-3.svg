<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">第五分回看第四分與第三分</title>
  <desc id="desc">黑白同心圓：中心為第五分，中圈為第四分，外圈為第三分。</desc>
  <rect width="320" height="320" fill="white"/>
  <circle cx="160" cy="160" r="112" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="160" cy="160" r="78" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="160" cy="160" r="42" fill="none" stroke="black" stroke-width="2"/>
  <text x="160" y="168" text-anchor="middle" font-family="serif" font-size="24" fill="black">5</text>
  <text x="160" y="98" text-anchor="middle" font-family="serif" font-size="20" fill="black">4</text>
  <text x="160" y="58" text-anchor="middle" font-family="serif" font-size="20" fill="black">3</text>
</svg>
