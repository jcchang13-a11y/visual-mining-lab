<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">第十八分心線回溯第十七分</title>
  <desc id="desc">中心為第十八分，向外回溯第十七分；第十七分拆發心者，第十八分再拆所發之心。</desc>
  <rect width="420" height="420" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2">
    <circle cx="210" cy="210" r="70"/>
    <circle cx="210" cy="210" r="150"/>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">
    <text x="210" y="217">18</text>
    <text x="210" y="82">17</text>
  </g>
</svg>
