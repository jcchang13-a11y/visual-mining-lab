<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="title desc">
  <title id="title">最後清場總覽由第二十九分回扣第一分</title>
  <desc id="desc">總覽在第一個藏身處直接把第二十九分的無所從來亦無所去，回扣第一分具體的來去坐臥與飯後現場。</desc>
  <rect width="260" height="260" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2"><circle cx="130" cy="130" r="38"/><circle cx="130" cy="130" r="88"/></g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" text-anchor="middle" dominant-baseline="middle">
    <text x="130" y="130" font-size="17">29</text><text x="130" y="66" font-size="20">1</text>
  </g>
</svg>
