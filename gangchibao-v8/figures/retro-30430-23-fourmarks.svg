<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">第二十三分沿四相施工史往前回溯</title>
  <desc id="desc">第二十三分以無我、無人、無眾生、無壽者修一切善法，結構上重新啟動前段四相線；圖由第二十三分向第十七、第十四、第六、第三分逐層回溯。</desc>
  <rect width="320" height="320" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <circle cx="160" cy="160" r="30"/>
    <circle cx="160" cy="160" r="60"/>
    <circle cx="160" cy="160" r="90"/>
    <circle cx="160" cy="160" r="120"/>
    <circle cx="160" cy="160" r="150"/>
  </g>
  <g fill="black" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">
    <text x="160" y="160">23</text>
    <text x="160" y="115">17</text>
    <text x="160" y="85">14</text>
    <text x="160" y="55">6</text>
    <text x="160" y="25">3</text>
  </g>
</svg>
