<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">第十六分回溯第十五分</title>
  <desc id="desc">黑白極簡同心圓。中心為第十六分，外圈標示第十五分，表示本單元把第十五分其福勝彼的功德比較線拉進更長的因果時間線重新計算。</desc>
  <rect width="360" height="360" fill="#fff"/>
  <circle cx="180" cy="180" r="112" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="44" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="174" text-anchor="middle" font-family="serif" font-size="18" fill="#111">第十六分</text>
  <text x="180" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">16</text>
  <text x="180" y="92" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第十五分</text>
  <text x="180" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">15</text>
</svg>
