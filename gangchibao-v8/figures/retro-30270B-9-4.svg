  <rect width="320" height="320" fill="#fff"/>
  <circle cx="160" cy="160" r="118" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="160" cy="160" r="56" fill="none" stroke="#111" stroke-width="2"/>
  <text x="160" y="167" text-anchor="middle" font-family="serif" font-size="26" fill="#111">9</text>
  <text x="160" y="58" text-anchor="middle" font-family="serif" font-size="22" fill="#111">4</text>
</svg>
