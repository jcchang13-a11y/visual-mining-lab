<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">第二十九分回溯第二十七、第二十六與第一分</title>
  <desc id="desc">黑白極簡同心圓。中心為第二十九分，外圈依回溯層次標示第二十七分、第二十六分、第一分，表示本段把如來的來去坐臥回接身相、斷滅相與第一分飯後現場。</desc>
  <rect width="360" height="360" fill="#fff"/>
  <circle cx="180" cy="180" r="150" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="112" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="76" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="42" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="174" text-anchor="middle" font-family="serif" font-size="18" fill="#111">第二十九分</text>
  <text x="180" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">29</text>
  <text x="180" y="114" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第二十七分</text>
  <text x="180" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">27</text>
  <text x="180" y="76" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第二十六分</text>
  <text x="180" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">26</text>
  <text x="180" y="38" text-anchor="middle" font-family="serif" font-size="16" fill="#111">第一分</text>
  <text x="180" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">1</text>
</svg>
