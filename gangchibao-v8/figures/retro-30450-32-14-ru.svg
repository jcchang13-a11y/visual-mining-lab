<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">第三十二分如字線回溯第十四分</title>
  <desc id="desc">黑白極簡同心圓。中心為第三十二分，外圈為第十四分。</desc>
  <rect width="420" height="420" fill="white"/>
  <circle cx="210" cy="210" r="150" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="210" cy="210" r="72" fill="none" stroke="black" stroke-width="2"/>
  <text x="210" y="206" text-anchor="middle" font-family="serif" font-size="24" fill="black">第三十二分</text>
  <text x="210" y="232" text-anchor="middle" font-family="serif" font-size="14" fill="black">如如不動</text>
  <text x="210" y="76" text-anchor="middle" font-family="serif" font-size="22" fill="black">第十四分</text>
</svg>
