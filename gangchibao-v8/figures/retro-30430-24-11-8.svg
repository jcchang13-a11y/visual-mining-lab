  <circle cx="160" cy="160" r="112" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="160" cy="160" r="78" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="160" cy="160" r="42" fill="none" stroke="black" stroke-width="2"/>
  <text x="160" y="168" text-anchor="middle" font-family="serif" font-size="24" fill="black">24</text>
  <text x="160" y="98" text-anchor="middle" font-family="serif" font-size="20" fill="black">11</text>
  <text x="160" y="58" text-anchor="middle" font-family="serif" font-size="20" fill="black">8</text>
</svg>
