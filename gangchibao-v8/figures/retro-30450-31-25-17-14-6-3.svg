<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">第三十一分回溯第二十五、第十七、第十四、第六與第三分</title>
  <desc id="desc">黑白極簡同心圓。中心為第三十一分，外圈依回溯層次標示第二十五分、第十七分、第十四分、第六分、第三分，表示本段把我見、人見、眾生見、壽者見回接前面反覆出現的四相施工線。</desc>
  <rect width="420" height="420" fill="#fff"/>
  <circle cx="210" cy="210" r="180" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="210" r="148" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="210" r="116" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="210" r="84" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="210" r="54" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="210" r="30" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="210" y="205" text-anchor="middle" font-family="serif" font-size="15" fill="#111">第三十一分</text>
  <text x="210" y="223" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#111">31</text>
  <text x="210" y="158" text-anchor="middle" font-family="serif" font-size="14" fill="#111">第二十五分</text>
  <text x="210" y="175" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#111">25</text>
  <text x="210" y="126" text-anchor="middle" font-family="serif" font-size="14" fill="#111">第十七分</text>
  <text x="210" y="143" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#111">17</text>
  <text x="210" y="94" text-anchor="middle" font-family="serif" font-size="14" fill="#111">第十四分</text>
  <text x="210" y="111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#111">14</text>
  <text x="210" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">第六分</text>
  <text x="210" y="79" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#111">6</text>
  <text x="210" y="30" text-anchor="middle" font-family="serif" font-size="14" fill="#111">第三分</text>
  <text x="210" y="47" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#111">3</text>
</svg>
