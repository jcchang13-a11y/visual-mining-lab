<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">MUTHER Remix 002 — Archive Roles</title><desc id="d">A vector recombination experiment derived from two archived image roles: a staged family portrait and a photographed narrative display. It reuses their palette, vertical composition, clock, wallpaper rhythm, document field and group arrangement without reproducing the source photographs.</desc><defs><pattern id="leaf" width="92" height="92" patternUnits="userSpaceOnUse"><path d="M8 78C27 62 34 38 39 12M39 44c17-8 29-20 37-36M30 58c-12-4-20-11-26-22M52 31c12 0 21 4 30 13" fill="none" stroke="#746f2d" stroke-width="5" stroke-linecap="round" opacity=".62"/><ellipse cx="37" cy="11" rx="8" ry="16" transform="rotate(28 37 11)" fill="#8d8336" opacity=".55"/><ellipse cx="75" cy="9" rx="8" ry="15" transform="rotate(50 75 9)" fill="#8d8336" opacity=".52"/><ellipse cx="6" cy="35" rx="8" ry="15" transform="rotate(-35 6 35)" fill="#8d8336" opacity=".48"/></pattern><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ead6a0"/><stop offset=".5" stop-color="#c98e59"/><stop offset="1" stop-color="#a76845"/></linearGradient><filter id="grain"><feTurbulence baseFrequency=".8" numOctaves="3" stitchTiles="stitch" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter></defs><rect width="1200" height="1600" fill="#d6bd64"/><rect width="1200" height="910" fill="url(#leaf)"/><rect y="910" width="1200" height="690" fill="#e6e1d5"/><circle cx="600" cy="210" r="92" fill="#6c472e" stroke="#342b25" stroke-width="12"/><circle cx="600" cy="210" r="57" fill="#e8ddbd" stroke="#342b25" stroke-width="6"/><g stroke="#342b25" stroke-width="5" stroke-linecap="round"><path d="M600 210l-18-36"/><path d="M600 210l42 9"/></g><g fill="#3d4439"><path d="M280 760c0-123 59-206 144-206s144 83 144 206v85H280z"/><path d="M636 760c