<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30000 外部媒體測試</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}.wrap{max-width:900px;margin:auto;padding:24px}img{max-width:100%;height:auto;display:block;background:#222}.card{border:1px solid #555;padding:18px}.ok{color:#8fd18f}.bad{color:#f39a9a}.muted{color:#aaa}</style></head><body><main class="wrap"><h1>30000 / 外部媒體隔離測試</h1><div class="card"><p>來源：Wikimedia Commons，Diamond sutra.jpg，Or.8210/P.2，868 年《金剛經》卷首圖。來源頁標示 public domain。</p><img id="sutra" src="https://upload.wikimedia.org/wikipedia/commons/0/07/Diamond_sutra.jpg" alt="Diamond Sutra 868 frontispiece"><p id="status" class="muted">TESTING / 等待外部圖片載入…</p><p><a href="https://commons.wikimedia.org/wiki/File:Diamond_sutra.jpg" target="_blank" rel="noopener" style="color:inherit">來源與授權說明</a></p></div><script>const im=document.getElementById('sutra'),s=document.getElementById('status');im.addEventListener('load',()=>{s.textContent='PASS / 外部 Wikimedia 圖片已直接載入';s.className='ok'});im.addEventListener('error',()=>{s.textContent='BLOCKED / 外部圖片直連失敗';s.className='bad'});</script></main></body></html>
