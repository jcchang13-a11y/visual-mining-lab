<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050706"><title>VAJRA ENGINE · TEST CHAMBER</title><style>:root{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#050706;color:#e0e5e1;--line:#303733;--muted:#78817c;--amber:#e4c56c;--panel:#0c100e}*{box-sizing:border-box}body{margin:0;background:#050706}.shell{max-width:900px;margin:auto;padding:24px 16px 70px}header,.section{padding:24px 0;border-bottom:1px solid var(--line)}.eyebrow,.label{font-size:.66rem;letter-spacing:.18em;color:var(--muted)}h1{font-size:clamp(2.7rem,13vw,6rem);line-height:.9;margin:15px 0}.status{color:var(--amber);font-size:.75rem}.plain{font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.7;color:#bac2bd}.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.box{border:1px solid var(--line);padding:14px}.big{font-size:1.7rem}.small{font-size:.7rem;color:var(--muted)}.trace{border-top:1px solid #242a27;padding:13px 0;font-size:.78rem;line-height:1.6}.back{display:inline-block;margin-top:20px;color:#dce8df;text-decoration:none;border-bottom:1px solid var(--line)}@media(max-width:520px){.metric{grid-template-columns:1fr}}</style></head><body><div class="shell"><header><div class="eyebrow">NOSTROMO · RECURSIVE COGNITION TEST CHAMBER</div><h1>VAJRA ENGINE</h1><div class="status" id="status">PROTOTYPE TESTING</div><p class="plain">這不是一句「A 即非 A」的展示。這裡記錄真正可執行的遞迴拆解原型與測試結果。</p></header><section class="section"><div class="label">BENCH TEST</div><div class="metric"><div class="box"><div class="big" id="runs">—</div><div class="small">TEST RUNS</div></div><div class="box"><div class="big" id="crashes">—</div><div class="small">CRASHES</div></div></div><p class="plain" id="failure">讀取測試紀錄…</p></section><section class="section"><div class="label">LIVE LOCAL DEMO</div><p class="plain">測試命題：NOSTROMO 是完全理性的機器。</p><div id="trace"></div></section><a class="back" href="../">← RETURN TO NOSTROMO</a></div><script src="./vajra-engine.js"></script><script src="./receipt-uncertainty-guard.js"></script><script>fetch('./test-state.json?ts='+Date.now()).then(r=>r.json()).then(d=>{status.textContent=d.status;runs.textContent=d.runs;crashes.textContent=d.crashes;failure.textContent='已知問題：'+d.knownFailure});const out=VajraEngine.run('NOSTROMO 是完全理性的機器',6);trace.innerHTML=out.trace.map(x=>`<div class="trace">ROUND ${x.round} · ${x.lens}<br>${x.next}</div>`).join('');</script></body></html>
