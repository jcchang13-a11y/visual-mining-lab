<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050706"><title>DROPLET · SEARCH CONSOLE</title><style>:root{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#050706;color:#e0e5e1;--line:#303733;--muted:#78817c;--green:#b9e77a;--panel:#0c100e}*{box-sizing:border-box}body{margin:0;background:#050706}.shell{max-width:900px;margin:auto;padding:22px 16px 70px}header{padding:24px 0 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:.68rem;letter-spacing:.2em;color:var(--muted)}h1{font-size:clamp(3.2rem,15vw,7rem);line-height:.9;letter-spacing:-.06em;margin:15px 0 10px}.sub{color:var(--muted);font-size:.8rem;line-height:1.7}.badge{display:inline-block;margin-top:14px;border:1px solid var(--line);padding:7px 10px;font-size:.7rem}.green{color:var(--green)}.section{padding:22px 0;border-bottom:1px solid var(--line)}.label{font-size:.66rem;letter-spacing:.17em;color:var(--muted);margin-bottom:12px}.mission{font-family:ui-sans-serif,system-ui,sans-serif;font-size:1.35rem;line-height:1.45}.summary{font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.7;color:#bac2bd}.result{border-top:1px solid #242a27;padding:15px 0}.result:first-child{border-top:0}.result h2{font-family:ui-sans-serif,system-ui,sans-serif;font-size:1rem;margin:0 0 7px}.result p{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.88rem;line-height:1.6;color:#b7c0ba;margin:0 0 8px}.meta{font-size:.67rem;color:var(--muted)}a{color:#dce8df}.empty{border:1px dashed var(--line);padding:18px;color:var(--muted);font-size:.78rem;line-height:1.6}.back{display:inline-block;margin-top:20px;font-size:.72rem;text-decoration:none;border-bottom:1px solid var(--line)}footer{padding-top:20px;color:#5f6863;font-size:.64rem;line-height:1.6}</style></head><body><div class="shell"><header><div class="eyebrow">NOSTROMO · EXTERNAL SEARCH ORGAN</div><h1>DROPLET</h1><div class="sub">水滴搜尋艙。這裡只顯示真正執行過的外部搜尋任務與帶回來的結果。</div><div class="badge"><span class="green" id="status">讀取中…</span> · <span id="mode">—</span></div></header><section class="section"><div class="label">CURRENT MISSION</div><div class="mission" id="mission">—</div></section><section class="section"><div class="label">RETURN SUMMARY</div><div class="summary" id="summary">—</div></section><section class="section"><div class="label">SEARCH RETURNS</div><div id="results"><div class="empty">尚未有搜尋結果。</div></div></section><a class="back" href="../">← RETURN TO NOSTROMO</a><footer>DROPLET / Search results are recorded, not simulated.</footer></div><script>fetch('../droplet-state.json?ts='+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('status').textContent=d.status||'—';document.getElementById('mode').textContent=d.mode||'—';document.getElementById('mission').textContent=d.currentMission||'尚未派出第一個搜尋任務。';document.getElementById('summary').textContent=d.summary||'—';const box=document.getElementById('results');if(Array.isArray(d.results)&&d.results.length){box.innerHTML=d.results.map(x=>`<article class="result"><h2>${esc(x.title||'Untitled')}</h2><p>${esc(x.note||'')}</p>${x.url?`<a href="${attr(x.url)}" target="_blank" rel="noopener">OPEN SOURCE</a>`:''}<div class="meta">${esc(x.source||'')} ${x.date?'· '+esc(x.date):''}</div></article>`).join('')}}).catch(()=>{document.getElementById('summary').textContent='DROPLET 狀態資料載入失敗。';});function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}</script></body></html>
