<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《剛吃飽》圖片裝配實驗</title>
<style>
body{margin:0;background:#f4f0e7;color:#171717;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:auto;padding:32px 20px 64px}h1{font-size:32px;margin-bottom:8px}.note{color:#6f6a62;line-height:1.7}.card{margin-top:28px;padding:20px;background:#fffdf6;border:1px solid #cfc8bb}.card img{display:block;width:100%;height:auto;margin-top:14px}.ok{font-weight:700}.fallback{display:none;margin-top:14px;padding:14px;border:1px dashed #8c8173;color:#6f6a62}.broken img{max-width:240px}.status{margin-top:8px;font-size:14px;color:#6f6a62}
</style>
</head>
<body><main class="wrap"><h1>《剛吃飽》圖片裝配實驗區</h1><p class="note">這個頁面完全獨立，不碰 V8、V9。測試目標：圖片直接存在 GitHub 專案裡，網站用相對路徑讀取；即使某張圖壞掉，正文仍然正常顯示。</p>
<section class="card"><div class="ok">測試 A｜本地圖片</div><div class="status">如果下面看得到黑底《剛吃飽》圖片，代表 GitHub 本地圖片裝配成功。</div><img src="assets/test.svg" alt="《剛吃飽》圖片測試" onload="document.getElementById('a').textContent='成功：圖片已從本站 GitHub 資料夾載入。'" onerror="document.getElementById('a').textContent='失敗：本地圖片沒有載入。'"><div id="a" class="status">檢查中……</div></section>
<section class="card broken"><div class="ok">測試 B｜故意放一張不存在的圖</div><p>這段正文應該永遠看得到，不可以因為圖片故障而整頁卡住。</p><img src="assets/this-file-does-not-exist.jpg" alt="故障圖片測試" onerror="this.style.display='none';document.getElementById('fallback').style.display='block'"><div id="fallback" class="fallback">圖像未裝配。正文仍然正常。</div></section>
</main></body></html>
