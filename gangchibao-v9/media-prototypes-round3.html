<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>剛吃飽 v9｜第三輪媒材原型</title>
<style>
:root{--paper:#f5f2e9;--ink:#171717;--line:#777}
*{box-sizing:border-box}body{margin:0;background:#d8d5cc;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.sheet{width:min(92vw,620px);min-height:900px;margin:32px auto;background:var(--paper);padding:42px;position:relative;overflow:hidden}.tag{font-size:11px;letter-spacing:.12em;color:#777;margin-bottom:32px}.monitor{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cam{height:180px;border:1px solid var(--line);position:relative;background:linear-gradient(90deg,transparent 49.8%,rgba(0,0,0,.05) 50%,transparent 50.2%)}.cam small{position:absolute;left:8px;top:7px;color:#666}.cam time{position:absolute;right:8px;bottom:7px;font-size:10px;color:#777}.cam:nth-child(2) small::after{content:'VIEW'}.cam:nth-child(2) small{font-size:0}.cam:nth-child(2) small::after{font-size:10px}.cam:nth-child(3) small::after{content:'SUBJECT'}.cam:nth-child(3) small{font-size:0}.cam:nth-child(3) small::after{font-size:10px}.cam:last-child small{display:none}.cam:last-child{border-color:#999}.form{border:1px solid #333}.row{display:grid;grid-template-columns:170px 1fr;min-height:62px;border-bottom:1px solid #777}.row:last-child{border-bottom:0}.row div{padding:12px}.row div:first-child{border-right:1px solid #777;font-size:12px}.line{border-bottom:1px solid #aaa;height:28px}.scale{height:720px;position:relative}.mark{position:absolute;border:1px solid #222}.s1{width:3px;height:3px;left:48%;top:40px}.s2{width:30px;height:30px;left:45%;top:120px}.s3{width:180px;height:180px;left:33%;top:220px}.s4{width:780px;height:780px;left:-90px;top:420px}.redact{margin-top:280px;font-family:serif;font-size:22px;line-height:1.8}.bar{display:inline-block;width:78%;height:1.15em;background:#111;vertical-align:-.18em}.fragment{position:absolute;right:-18px;bottom:105px;width:74px;height:31px;border-left:1px solid #777;border-top:1px solid #777}.fragment::after{content:'03:2_:';position:absolute;top:-15px;left:7px;font-size:9px;color:#888}.note{font-family:system-ui,sans-serif;font-size:13px;line-height:1.7;color:#666}
</style>
</head>
<body>
<section class="sheet"><div class="tag">M1 / NO CONTROL ROOM</div><div class="monitor"><div class="cam"><small>CAMERA</small><time>03:20:13</time></div><div class="cam"><small>CAMERA</small><time>03:20:14</time></div><div class="cam"><small>CAMERA</small><time>03:20:15</time></div><div class="cam"><small>CAMERA</small><time>--:--:--</time></div></div><p class="note">沒有觀看對象；分類欄本身開始交換位置。正式版不加說明。</p></section>
<section class="sheet"><div class="tag">M2 / APPLICATION</div><div class="form"><div class="row"><div>申請人姓名</div><div><div class="line"></div></div></div><div class="row"><div>請證明上述申請人不存在固定自性</div><div><div class="line"></div></div></div><div class="row"><div>證明人</div><div><div class="line"></div></div></div><div class="row"><div>證明人與申請人之關係</div><div><div class="line"></div></div></div><div class="row"><div>本申請由誰提出</div><div><div class="line"></div></div></div><div class="row"><div>核准後證書應發給</div><div></div></div></div><p class="note">表格沒有正確填法；正式版裁掉最後一欄下緣。</p></section>
<section class="sheet"><div class="tag">M3 / SCALE</div><div class="scale"><i class="mark s1"></i><i class="mark s2"></i><i class="mark s3"></i><i class="mark s4"></i></div></section>
<section class="sheet"><div class="tag">M4 / REMOVED</div><div class="redact">因此，本書最後可以歸結為：<span class="bar"></span></div></section>
<section class="sheet"><div class="tag">M5 / RESIDUE</div><div class="fragment"></div></section>
</body></html>
