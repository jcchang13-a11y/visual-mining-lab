<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>影像實驗台｜Visual Mining Lab</title><style>:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eceeea;background:#0d0f0f;--line:#2b3130;--muted:#9aa39f;--panel:#151918;--accent:#d7ff66}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#1d2522 0,#0d0f0f 42rem);color:#eceeea}a{color:inherit}.shell{max-width:1180px;margin:auto;padding:18px 14px 80px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:14px 2px 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(1.8rem,7vw,4.7rem);line-height:.95;margin:.35rem 0 .2rem;font-weight:700;letter-spacing:-.05em}.sub{color:var(--muted);font-size:.88rem;max-width:42rem;line-height:1.55}.live{white-space:nowrap;border:1px solid #3d4844;border-radius:99px;padding:7px 10px;font-size:.78rem;color:#cbd3cf}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);margin-right:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 24px}.stat{border:1px solid var(--line);background:#111413;padding:13px 12px;min-height:88px}.stat b{display:block;font-size:1.8rem}.stat span{color:var(--muted);font-size:.78rem}.section{border-top:1px solid var(--line);padding:24px 0}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}h2{font-size:1.08rem;margin:0}.hint{color:var(--muted);font-size:.78rem;line-height:1.5}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:2px;margin:0 0 12px}.tab{border:1px solid var(--line);background:transparent;color:#cad1ce;padding:8px 11px;border-radius:99px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--accent);color:#0c0f0e;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.card{border:1px solid var(--line);background:var(--panel);min-width:0;overflow:hidden;text-decoration:none}.thumb{aspect-ratio:4/3;background:#202724;display:block;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.fallback{position:absolute;left:7px;bottom:7px;background:rgba(12,15,14,.78);padding:4px 6px;font-size:.65rem;color:#c9d0cd;border:1px solid #39413e}.meta{padding:9px}.name{font-size:.77rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.micro{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.68rem;margin-top:6px}.tag{color:var(--accent)}.starwrap{border:1px solid var(--line);background:#101312;overflow:hidden}.starmap{display:block;width:100%;height:auto;min-height:320px}.axis{stroke:#28302d;stroke-width:1}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);font-size:.73rem;color:var(--muted)}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.grammar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grammar{border:1px solid var(--line);background:var(--panel);padding:14px}.grammar-top{display:flex;justify-content:space-between;gap:8px}.gid{color:var(--accent);font-size:.72rem}.stage{color:var(--muted);font-size:.7rem}.grammar h3{font-size:1rem;margin:.25rem 0 .45rem}.grammar p{font-size:.77rem;color:#b8c0bc;line-height:1.6;min-height:3.8em}.radar{width:100%;max-width:190px;display:block;margin:8px auto}.scores{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:.7rem;color:var(--muted)}.timeline{display:grid;gap:8px}.change{display:grid;grid-template-columns:130px 1fr 1fr;gap:12px;border-top:1px solid var(--line);padding:12px 0;font-size:.78rem}.change time{color:var(--accent)}.before{color:#aab2ae}.after{color:#e6eae7}.foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);color:#707a76;font-size:.7rem;line-height:1.6}.empty{border:1px dashed var(--line);padding:24px;color:var(--muted);font-size:.8rem}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.grammar-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.change{grid-template-columns:1fr}.starwrap{margin-left:-14px;margin-right:-14px;border-left:0;border-right:0}}@media(max-width:420px){header{display:block}.live{display:inline-block;margin-top:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.meta{padding:7px}.micro{font-size:.62rem}}</style></head><body><div class="shell"><header><div><div class="eyebrow">Visual Mining Lab / live state</div><h1>影像實驗台</h1><div class="sub">不是相簿。這裡顯示素材如何被 AI 注意、遺忘、抽樣、聚成暫時群落，以及候選視覺語法如何改變。</div></div><div class="live"><span class="dot"></span><span id="source">等待資料同步</span></div></header><div class="stats"><div class="stat"><b id="sTotal">—</b><span>素材總數</span></div><div class="stat"><b id="sAttention">—</b><span>AI 正在注意</span></div><div class="stat"><b id="sUnseen">—</b><span>尚未被注意</span></div><div class="stat"><b id="sGrammar">—</b><span>候選語法</span></div></div><section class="section"><div class="section-head"><div><h2>素材池</h2><div class="hint">最近加入／AI 正在注意／尚未被注意／漂移抽樣。</div></div></div><div class="tabs" id="tabs"></div><div id="pool"></div></section><section class="section"><div class="section-head"><div><h2>AI 注意力／群落星圖</h2><div class="hint">亮點代表目前已被注意；位置是觀察座標，不宣稱照片的本體分類。</div></div></div><div class="starwrap"><svg id="star" class="starmap" viewBox="0 0 360 340"></svg><div class="legend"><span><i style="background:#d7ff66"></i>已注意</span><span><i style="background:#58635f"></i>未注意</span></div></div></section><section class="section"><div class="section-head"><div><h2>候選視覺語法</h2><div class="hint">症頭 → 重複 → 規律 → 語法。</div></div></div><div id="grammars" class="grammar-grid"></div></section><section class="section"><div class="section-head"><div><h2>變化紀錄</h2><div class="hint">舊判斷不覆蓋；方向改變會留下歷史。</div></div></div><div id="changes" class="timeline"></div></section><div class="foot" id="foot">等待第一次公開狀態同步。</div></div><script>const axes=['穩定性','可重複','可變形','陌生感','表意力'];let LAB=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function radar(scores={}){const pts=l=>axes.map((a,i)=>{const ang=-Math.PI/2+i*Math.PI*2/axes.length,r=64*l;return `${(88+Math.cos(ang)*r).toFixed(1)},${(88+Math.sin(ang)*r).toFixed(1)}`}).join(' ');const p=axes.map((a,i)=>{const ang=-Math.PI/2+i*Math.PI*2/axes.length,r=64*((scores[a]||0)/10);return `${(88+Math.cos(ang)*r).toFixed(1)},${(88+Math.sin(ang)*r).toFixed(1)}`}).join(' ');return `<svg class="radar" viewBox="0 0 176 176">${[.33,.66,1].map(l=>`<polygon points="${pts(l)}" fill="none" stroke="#34403b"/>`).join('')}<polygon points="${p}" fill="rgba(215,255,102,.10)" stroke="#d7ff66" stroke-width="1.5"/></svg>`}function renderPool(mode){const all=LAB.materials||[];let list=[];if(mode==='recent')list=[...all].sort((a,b)=>String(b.uploadedAt).localeCompare(String(a.uploadedAt))).slice(0,12);if(mode==='attention')list=all.filter(x=>x.attention==='已注意');if(mode==='unseen')list=all.filter(x=>x.attention!=='已注意');if(mode==='drift')list=all.filter(x=>x.sample==='drift').slice(0,12);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.key===mode));document.getElementById('pool').innerHTML=list.length?`<div class="grid">${list.map(m=>`<a class="card" href="${esc(m.driveUrl||'#')}" target="_blank" rel="noreferrer"><span class="thumb">${m.thumbUrl?`<img src="${esc(m.thumbUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}<span class="fallback">${m.attention==='已注意'?'AI 已讀':'待讀'}</span></span><div class="meta"><div class="name">${esc(m.fileName)}</div><div class="micro"><span>${esc(m.cluster)}</span><span class="${m.attention==='已注意'?'tag':''}">${esc(m.attention)}</span></div></div></a>`).join('')}</div>`:`<div class="empty">這個入口目前沒有素材。</div>`}function render(lab){LAB=lab;const s=lab.summary||{};sTotal.textContent=s.total??0;sAttention.textContent=s.attention??0;sUnseen.textContent=s.unseen??0;sGrammar.textContent=s.grammars??0;source.textContent=`資料源：${lab.source?.folder||'紅米手機照片'}`;tabs.innerHTML=[['recent','最近加入'],['attention','AI 正在注意'],['unseen','尚未被注意'],['drift','漂移抽樣']].map(([k,t],i)=>`<button class="tab ${i?'':'active'}" data-key="${k}">${t}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>renderPool(b.dataset.key));renderPool('recent');star.innerHTML=`<line class="axis" x1="180" y1="18" x2="180" y2="322"/><line class="axis" x1="18" y1="170" x2="342" y2="170"/><circle cx="180" cy="170" r="58" fill="none" stroke="#222a27"/><circle cx="180" cy="170" r="118" fill="none" stroke="#1d2422"/>${(lab.materials||[]).map(m=>`<a href="${esc(m.driveUrl||'#')}" target="_blank"><circle cx="${Number(m.x)||180}" cy="${Number(m.y)||170}" r="${m.attention==='已注意'?5:2.6}" fill="${m.attention==='已注意'?'#d7ff66':'#58635f'}"><title>${esc(m.fileName)} · ${esc(m.cluster)} · ${esc(m.attention)}</title></circle></a>`).join('')}`;grammars.innerHTML=(lab.grammars||[]).map(g=>`<article class="grammar"><div class="grammar-top"><span class="gid">${esc(g.id)}</span><span class="stage">${esc(g.stage)}</span></div><h3>${esc(g.name)}</h3><p>${esc(g.description)}</p>${radar(g.scores)}<div class="scores">${axes.map(a=>`<span>${a} ${g.scores?.[a]??0}/10</span>`).join('')}</div></article>`).join('')||'<div class="empty">尚未形成候選語法。</div>';changes.innerHTML=(lab.changes||[]).map(c=>`<div class="change"><time>${esc(c.time)}</time><div class="before">原：${esc(c.before)}</div><div class="after">新：${esc(c.after)}<br><span class="hint">${esc(c.reason)}</span></div></div>`).join('')||'<div class="empty">尚無變化紀錄。</div>';foot.textContent=`狀態快照：${lab.generatedAt||'—'} · 原則：不生成影像、不改原檔名，只在確認重複時處理副本。`}fetch('./visual-mining.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('snapshot missing');return r.json()}).then(render).catch(()=>{pool.innerHTML='<div class="empty">前台已部署，等待第一次資料快照同步。</div>';foot.textContent='前台已就緒；資料同步尚未完成。';});</script></body></html>
