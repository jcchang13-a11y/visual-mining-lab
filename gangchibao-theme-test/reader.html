<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>剛吃飽｜Theme 001 Reader</title>
<link rel="stylesheet" href="theme-001.css?v=20260913-r2">
</head>
<body>
<main class="reader-shell">
<header class="reader-top">
<p class="host-kicker">佛教文庫 · 結緣流通測試本</p>
<h1 class="reader-title" id="title">讀取中</h1>
<p class="reader-status" id="status">正文來源：正式 V8 唯讀</p>
<nav class="reader-nav" id="nav"><a href="index.html">目次</a></nav>
</header>
<article class="article" id="article">讀取中……</article>
<p class="source-note">此測試頁不持有正文副本；只讀 <code>../gangchibao-v8/unit-*.md</code>。Theme 變動與正式正文隔離。</p>
</main>
<script>
const units=['30000','30210','30220','30230','30240B','30250','30260B','30270B','30280B','30310B','30320','30330','30340','30350A','30360','30370','30380','30390','30410A','30430','30440','30450'];
const params=new URLSearchParams(location.search);const u=units.includes(params.get('u'))?params.get('u'):units[0];const i=units.indexOf(u);
document.getElementById('title').textContent='第 '+String(i+1).padStart(2,'0')+' 單元 · '+u;
const nav=document.getElementById('nav');if(i>0)nav.insertAdjacentHTML('beforeend','<a href="reader.html?u='+units[i-1]+'">上一單元</a>');if(i<units.length-1)nav.insertAdjacentHTML('beforeend','<a href="reader.html?u='+units[i+1]+'">下一單元</a>');
function makeFormula(label){const el=document.createElement('span');el.className='formula';const a=document.createElement('span');a.textContent=label;const bar=document.createElement('span');bar.className='bar';const b=document.createElement('span');b.textContent='～'+label;el.append(a,bar,b);return el}
function render(text){const root=document.getElementById('article');root.textContent='';const re=/\{\{([^{}\n]+)\}\}/g;let last=0,m;while((m=re.exec(text))){if(m.index>last)root.append(document.createTextNode(text.slice(last,m.index)));root.append(makeFormula(m[1].trim()));last=re.lastIndex}if(last<text.length)root.append(document.createTextNode(text.slice(last)))}
fetch('../gangchibao-v8/unit-'+u+'.md?v=20260913-r2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>{render(t.replace(/^\uFEFF/,''));document.getElementById('status').textContent='正式 V8 正文唯讀成功 · Theme 001 覆層運作中';document.body.dataset.sourceUnit=u;document.body.dataset.sourceMode='readonly-v8'}).catch(e=>{const a=document.getElementById('article');a.className='article load-error';a.textContent='正文讀取失敗：'+e.message;document.getElementById('status').textContent='ROUND 2 BLOCKED · 未宣告成功';document.body.dataset.sourceMode='failed'});
</script>
</body>
</html>
