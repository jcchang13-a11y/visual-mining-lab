name: NOSTROMO GUT capability incorporation test
on:
  push:
    paths:
      - 'nostromo/gut/capability-incorporation.mjs'
      - 'nostromo/gut/capability-repeated-stress.mjs'
      - 'nostromo/gut/capability-heldout-stress.mjs'
      - 'nostromo/gut/capability-sandbox.mjs'
      - '.github/workflows/nostromo-gut-capability-incorporation-test.yml'
  workflow_dispatch:
jobs:
  reversible-incorporation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reversible candidate and rollback boundary
        run: |
          node --input-type=module <<'EOF'
          import {runReversibleIncorporationCandidate} from './nostromo/gut/capability-incorporation.mjs';
          const candidate={adapterId:'foreign.signal',source:'fixture',permissions:['read'],interface:'signal'};
          const capabilityRegistry={'foreign.signal': input=>({flag:input.flag===true})};
          const organRegistry={VAJRA:({foreignSignal})=>({route:foreignSignal?.flag?'challenge':'hold'})};
          const cases=[
            {id:'positive-a',input:{flag:true,n:1},expectedChange:true},
            {id:'negative',input:{flag:false,n:2},expectedChange:false},
            {id:'positive-b',input:{flag:true,n:3},expectedChange:true}
          ];
          const run=(body,registry=capabilityRegistry)=>runReversibleIncorporationCandidate(candidate,cases,body,{capabilityRegistry:registry,organRegistry,downstreamOrganId:'VAJRA',context:{source:'fixture',provenanceFingerprint:'fixture-provenance-v1'}});
          const body={organs:{GUT:{status:'ACTIVE',metabolism:{echoGuard:true,threshold:2}},VAJRA:{status:'ACTIVE'}},capabilities:{},history:[{round:1,status:'PASS'}]};
          const snapshot=JSON.stringify(body);
          const out=run(body);
          if(out.status!=='PASS')throw new Error(JSON.stringify(out));
          if(out.assimilationStage!=='REVERSIBLE_BODY_CANDIDATE_CREATED')throw new Error('wrong stage');
          if(out.persistentMutation!==false||out.bodyAdmission!==false||out.installed!==false)throw new Error('boundary lied');
          if(out.registryLookup!=='OWN_DATA_PROPERTY_ONLY')throw new Error('registry lookup boundary not declared');
          if(out.bodyCopyBoundary!=='STRUCTURED_CLONE_FAIL_CLOSED')throw new Error('body clone boundary not declared');
          if(out.bodyPropertyRead!=='OWN_DATA_PROPERTY_DESCRIPTOR_ONLY')throw new Error('body property read boundary not declared');
          if(JSON.stringify(body)!==snapshot||out.originalBodyUnchanged!==true)throw new Error('source body mutated');
          if(out.candidateBody.capabilities['foreign.signal']?.status!=='REVERSIBLE_TRIAL_ONLY')throw new Error('candidate missing');
          if(out.rollback?.restoresFingerprint!==out.beforeFingerprint)throw new Error('rollback evidence missing');
          if(out.fingerprintBoundary?.nestedStateBound!==true)throw new Error('nested fingerprint boundary not declared');
          if(out.fingerprintBoundary?.accessorStateAccepted!==false)throw new Error('accessor fingerprint boundary not declared');

          const nestedChanged=structuredClone(body);
          nestedChanged.organs.GUT.metabolism.threshold=3;
          const nestedOut=run(nestedChanged);
          if(nestedOut.status!=='PASS')throw new Error('nested-change control failed');
          if(nestedOut.beforeFingerprint===out.beforeFingerprint)throw new Error('nested body-state collision: rollback provenance cannot distinguish metabolic state');

          const reordered={history:[{status:'PASS',round:1}],capabilities:{},organs:{VAJRA:{status:'ACTIVE'},GUT:{metabolism:{threshold:2,echoGuard:true},status:'ACTIVE'}}};
          const reorderedOut=run(reordered);
          if(reorderedOut.status!=='PASS')throw new Error('reordered control failed');
          if(reorderedOut.beforeFingerprint!==out.beforeFingerprint)throw new Error('object key order changed canonical body fingerprint');

          const cyclic={organs:{GUT:{status:'ACTIVE'}},capabilities:{}};
          cyclic.self=cyclic;
          const cyclicOut=run(cyclic);
          if(cyclicOut.status!=='BLOCKED'||cyclicOut.reason!=='fingerprintable-acyclic-data-property-host-body-state-required')throw new Error('cyclic body state must fail closed before trial');

          const inheritedRegistry=Object.create({'foreign.signal': input=>({flag:input.flag===true})});
          const inheritedOut=run(body,inheritedRegistry);
          if(inheritedOut.status==='PASS'||inheritedOut.stress?.status==='PASS')throw new Error('inherited capability registry entry crossed the incorporation boundary');

          let registryGetterExecuted=false;
          const accessorRegistry={};
          Object.defineProperty(accessorRegistry,'foreign.signal',{enumerable:true,get(){registryGetterExecuted=true;return input=>({flag:input.flag===true});}});
          const accessorOut=run(body,accessorRegistry);
          if(registryGetterExecuted)throw new Error('capability registry getter executed');
          if(accessorOut.status==='PASS'||accessorOut.stress?.status==='PASS')throw new Error('accessor capability registry entry crossed the incorporation boundary');

          let bodyGetterExecuted=false;
          const accessorBody={organs:{GUT:{status:'ACTIVE'},VAJRA:{status:'ACTIVE'}},capabilities:{}};
          Object.defineProperty(accessorBody,'ephemeral',{enumerable:true,get(){bodyGetterExecuted=true;return 'side-effect';}});
          const accessorBodyOut=run(accessorBody);
          if(bodyGetterExecuted)throw new Error('top-level body getter executed during fingerprinting');
          if(accessorBodyOut.status!=='BLOCKED'||accessorBodyOut.reason!=='fingerprintable-acyclic-data-property-host-body-state-required')throw new Error('top-level body accessor must fail closed');

          let nestedBodyGetterExecuted=false;
          const nestedAccessorBody={organs:{GUT:{status:'ACTIVE',metabolism:{}},VAJRA:{status:'ACTIVE'}},capabilities:{}};
          Object.defineProperty(nestedAccessorBody.organs.GUT.metabolism,'threshold',{enumerable:true,get(){nestedBodyGetterExecuted=true;return 2;}});
          const nestedAccessorOut=run(nestedAccessorBody);
          if(nestedBodyGetterExecuted)throw new Error('nested body getter executed during fingerprinting');
          if(nestedAccessorOut.status!=='BLOCKED'||nestedAccessorOut.reason!=='fingerprintable-acyclic-data-property-host-body-state-required')throw new Error('nested body accessor must fail closed');

          const uncloneable={organs:{GUT:{status:'ACTIVE'},VAJRA:{status:'ACTIVE'}},capabilities:{},ephemeral:()=>true};
          const uncloneableOut=run(uncloneable);
          if(uncloneableOut.status!=='BLOCKED'||uncloneableOut.reason!=='structured-cloneable-host-body-state-required')throw new Error('uncloneable body state must fail closed');
          if(uncloneableOut.bodyAdmission!==false||uncloneableOut.persistentMutation!==false)throw new Error('uncloneable body crossed admission boundary');

          console.log('PASS reversible incorporation boundary with descriptor-safe body fingerprinting, nested rollback fingerprint, registry containment, and fail-closed host-body cloning',out.beforeFingerprint,out.candidateFingerprint);
          EOF