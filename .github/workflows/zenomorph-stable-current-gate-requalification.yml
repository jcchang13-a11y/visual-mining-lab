name: ZENOMORPH Stable Current-Gate Requalification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nostromo/runtime/**'
      - 'nostromo/integration/big-meal-offspring-qualification-runner.mjs'
      - '.github/workflows/zenomorph-stable-current-gate-requalification.yml'

permissions:
  contents: read

jobs:
  requalify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Requalify remaining current gates without mutating Stable
        run: node nostromo/runtime/stable-p0_5-current-gate-requalification.mjs --output=zenomorph-current-gate-requalification.json
      - name: Upload fresh requalification receipt
        uses: actions/upload-artifact@v4
        with:
          name: zenomorph-p0-5-current-gate-requalification
          path: zenomorph-current-gate-requalification.json
          if-no-files-found: error
