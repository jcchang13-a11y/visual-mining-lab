name: NOSTROMO GUT Symbol Promote

on:
  push:
    branches: [ main ]
    paths:
      - '.nostromo-triggers/gut-symbol-promote.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence and promote public GUT Symbol status
        run: node nostromo/integration/promote-gut-symbol.mjs
      - name: Commit evidence-backed promotion
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nostromo/integration/organ-registry.json nostromo/index.html
          git commit -m "NOSTROMO: promote verified GUT v0.2.30 Symbol preservation"
          git pull --rebase origin main
          git push origin HEAD:main
