name: Normalize V8 formulas

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/normalize_v8_formulas.py'
      - '.github/workflows/v8-formula-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize V8 formula syntax
        run: python scripts/normalize_v8_formulas.py
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            echo 'No formula normalization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gangchibao-v8 scripts/normalize_v8_formulas.py
          git commit -m 'Normalize V8 formula syntax'
          git push
