name: NOSTROMO VAJRA Dynamic Decomposition Test

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/vajra/dynamic-decomposition.js'
      - 'nostromo/vajra/dynamic-decomposition-test.mjs'
      - 'nostromo/vajra/dynamic-multiparent-test.mjs'
      - 'nostromo/vajra/target-qualification-guard.js'
      - 'nostromo/vajra/target-qualification-guard-test.mjs'
      - 'nostromo/vajra/dynamic-reinspection.js'
      - 'nostromo/vajra/vajra-engine.js'
      - 'nostromo/integration/gut-metabolism-test.mjs'
      - 'nostromo/integration/vajra-dynamic-test.mjs'
      - 'nostromo/failure-log/2026-09-08-vajra-receipt-key-order-replay.json'
      - 'nostromo/failure-log/2026-09-08-vajra-transport-metadata-replay.json'
      - 'nostromo/failure-log/2026-09-08-vajra-triage-classification-behavior-invariance.json'
      - 'nostromo/failure-log/2026-09-08-vajra-multiparent-target-selection.json'
      - 'nostromo/failure-log/2026-09-08-vajra-nonqualifying-receipt-target-pollution.json'
      - 'nostromo/failure-log/2026-09-09-vajra-agreeing-distinct-provenance-false-conflict.json'
      - 'nostromo/failure-log/2026-09-09-vajra-nonqualifying-receipt-target-poisoning.json'
      - '.github/workflows/nostromo-vajra-dynamic-decomposition-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classification-regulated-decomposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: VAJRA unit, adversarial, provenance, replay and behavior-regulation tests
        run: node nostromo/vajra/dynamic-decomposition-test.mjs
      - name: VAJRA multi-parent qualification and target-poisoning regression
        run: node nostromo/vajra/dynamic-multiparent-test.mjs
      - name: VAJRA qualification-guard compatibility regression
        run: node nostromo/vajra/target-qualification-guard-test.mjs
      - name: Cross-organ GUT regression
        run: node nostromo/integration/gut-metabolism-test.mjs
      - name: Cross-organ VAJRA regression
        run: node nostromo/integration/vajra-dynamic-test.mjs
      - name: Evidence boundary
        run: |
          node -e "const fs=require('fs'); const u=JSON.parse(fs.readFileSync('nostromo/vajra/dynamic-decomposition-last-result.json','utf8')); const a=JSON.parse(fs.readFileSync('nostromo/vajra/dynamic-multiparent-last-result.json','utf8')); const b=JSON.parse(fs.readFileSync('nostromo/vajra/target-qualification-guard-last-result.json','utf8')); if(u.status!=='PASS'||u.capability!=='QUALIFICATION_GATED_DYNAMIC_DECOMPOSITION_CORE'||a.status!=='PASS'||a.capability!=='QUALIFYING_RECEIPT_SCOPED_MULTI_PARENT_DYNAMIC_DECOMPOSITION'||b.status!=='PASS'||b.capability!=='QUALIFICATION_GATED_MULTI_PARENT_TARGET_SELECTION_WITH_PROVENANCE_DIVERSITY_CONTAINMENT') process.exit(1); console.log(JSON.stringify({status:'PASS',capabilities:[u.capability,a.capability,b.capability],provenance:b.provenance,boundary:'CI verifies qualification gating in the core decomposition path plus compatibility with the existing wrapper guard. It does not claim source truth, facet execution, or persistent self-modification.'},null,2));"
