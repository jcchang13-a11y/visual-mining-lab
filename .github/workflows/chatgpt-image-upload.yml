name: ChatGPT Image Upload

on:
  push:
    paths:
      - '.image-upload/upload.ready'

permissions:
  contents: write

jobs:
  install-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild image
        shell: bash
        run: |
          set -euo pipefail
          cat .image-upload/chunk-* | tr -d '\n\r' | base64 --decode > immortalia/immortalia-map.jpg
          rm -rf .image-upload
      - name: Commit image
        shell: bash
        run: |
          git config user.name "immortalia-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- immortalia/immortalia-map.jpg .image-upload
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Immortalia image"
          git push
