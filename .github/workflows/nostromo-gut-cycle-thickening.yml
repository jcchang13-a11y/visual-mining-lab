name: NOSTROMO GUT Cycle Thickening

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/integration/apply-gut-cycle-thickening.mjs'
      - 'nostromo/integration/gut-cycle-test.mjs'
      - '.github/workflows/nostromo-gut-cycle-thickening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thicken-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply GUT cycle quarantine patch
        run: node nostromo/integration/apply-gut-cycle-thickening.mjs
      - name: Verify GUT cycle adversarial cases
        run: node nostromo/integration/gut-cycle-test.mjs
      - name: Run GUT metabolism regression
        run: node nostromo/integration/gut-metabolism-test.mjs
      - name: Commit verified GUT cycle thickening
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nostromo/gut/gut-engine.js nostromo/integration/gut-metabolism-test.mjs nostromo/integration/gut-cycle-last-result.json
          if git diff --cached --quiet; then
            echo "No verified thickening change"
          else
            git commit -m "[nostromo-test] promote verified GUT v0.2.35 cycle quarantine"
            # Regression tests may refresh evidence files that are intentionally not part of this focused commit.
            # Remove only post-test workspace residue so rebase can safely incorporate concurrent main changes.
            git restore --worktree .
            git clean -fd
            git pull --rebase origin main
            git push origin HEAD:main
          fi
