name: NOSTROMO GUT BigInt Promote

on:
  push:
    branches: [ main ]
    paths:
      - '.nostromo-triggers/gut-bigint-promote.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote only from verified evidence
        run: node nostromo/integration/promote-gut-bigint-status.mjs
      - name: Commit promoted registry and public status
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nostromo/integration/organ-registry.json nostromo/index.html
          git commit -m "NOSTROMO: publish verified GUT v0.2.29 BigInt status"
          git pull --rebase origin main
          git push origin HEAD:main
