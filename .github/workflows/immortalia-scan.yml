name: Immortalia Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run scanner
        run: python immortalia/owner/scans/scan.py

      - name: Commit scan result
        run: |
          git config user.name "immortalia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add immortalia/owner/scans/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Immortalia scan results"
          git push
