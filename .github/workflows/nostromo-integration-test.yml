name: NOSTROMO Integration Test

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/integration/**'
      - 'nostromo/gut/**'
      - 'nostromo/vajra/**'
      - 'nostromo/droplet-state.json'
      - 'mycelium/state.json'
      - 'mother-latest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[nostromo-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 50-round integration test
        run: node nostromo/integration/ci-test.mjs
      - name: Commit test result
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nostromo/integration/ci-last-result.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "[nostromo-test] record integration CI result"
            git push
          fi
