name: NOSTROMO Integration Test

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/integration/**'
      - 'nostromo/gut/**'
      - 'nostromo/vajra/**'
      - 'nostromo/droplet-state.json'
      - 'mycelium/state.json'
      - 'mother-latest.json'
      - 'greenhouse/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[nostromo-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify formal greenhouse continuity
        id: formal
        run: node nostromo/integration/formal-round-test.mjs
      - name: Run 50-round integration test
        id: integration
        continue-on-error: true
        run: node nostromo/integration/ci-test.mjs
      - name: Commit test results
        if: always()
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          test -f nostromo/integration/formal-round-last-result.json && cp nostromo/integration/formal-round-last-result.json /tmp/nostromo-formal-round-last-result.json || true
          test -f nostromo/integration/ci-last-result.json && cp nostromo/integration/ci-last-result.json /tmp/nostromo-ci-last-result.json || true
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/nostromo-formal-round-last-result.json ]; then
            cp /tmp/nostromo-formal-round-last-result.json nostromo/integration/formal-round-last-result.json
            git add nostromo/integration/formal-round-last-result.json
          fi
          if [ -f /tmp/nostromo-ci-last-result.json ]; then
            cp /tmp/nostromo-ci-last-result.json nostromo/integration/ci-last-result.json
            git add nostromo/integration/ci-last-result.json
          fi
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "[nostromo-test] record integration and formal-chain results"
            git push origin HEAD:main
          fi
      - name: Enforce integration conclusion
        if: steps.integration.outcome != 'success'
        run: exit 1
