name: NOSTROMO Integration Test

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/integration/**'
      - 'nostromo/gut/**'
      - 'nostromo/vajra/**'
      - 'nostromo/droplet-state.json'
      - 'mycelium/state.json'
      - 'mother-latest.json'
      - 'greenhouse/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[nostromo-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify formal greenhouse continuity
        id: formal
        run: node nostromo/integration/formal-round-test.mjs
      - name: Verify MU/TH/UR repository falsification executor
        id: muther_falsify
        continue-on-error: true
        run: node nostromo/integration/muther-falsify-test.mjs
      - name: Verify DROPLET claim evidence executor
        id: droplet_claim_verify
        continue-on-error: true
        run: node nostromo/integration/droplet-claim-verify-test.mjs
      - name: Verify GUT metabolism and connector feedback routing
        id: gut_metabolism
        continue-on-error: true
        run: node nostromo/integration/gut-metabolism-test.mjs
      - name: Verify GUT volatile-lineage anti-echo boundary
        id: gut_lineage
        continue-on-error: true
        run: node nostromo/integration/gut-lineage-test.mjs
      - name: Verify VAJRA proposition-aware dismantling
        id: vajra_dynamic
        continue-on-error: true
        run: node nostromo/integration/vajra-dynamic-test.mjs
      - name: Verify VAJRA conflicting-receipt preservation
        id: vajra_conflict
        continue-on-error: true
        run: node nostromo/integration/vajra-conflict-test.mjs
      - name: Verify VAJRA uncertainty-aware receipt closure
        id: vajra_uncertainty
        continue-on-error: true
        run: node nostromo/integration/vajra-uncertainty-test.mjs
      - name: Verify SHROOMING feedback-conditioned reading
        id: shroom_feedback
        continue-on-error: true
        run: node nostromo/integration/shroom-feedback-test.mjs
      - name: Run 50-round integration test
        id: integration
        continue-on-error: true
        run: node nostromo/integration/ci-test.mjs
      - name: Commit test results
        if: always()
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          test -f nostromo/integration/formal-round-last-result.json && cp nostromo/integration/formal-round-last-result.json /tmp/nostromo-formal-round-last-result.json || true
          test -f nostromo/integration/ci-last-result.json && cp nostromo/integration/ci-last-result.json /tmp/nostromo-ci-last-result.json || true
          test -f nostromo/integration/muther-falsify-last-result.json && cp nostromo/integration/muther-falsify-last-result.json /tmp/nostromo-muther-falsify-last-result.json || true
          test -f nostromo/integration/droplet-claim-verify-last-result.json && cp nostromo/integration/droplet-claim-verify-last-result.json /tmp/nostromo-droplet-claim-verify-last-result.json || true
          test -f nostromo/integration/gut-metabolism-last-result.json && cp nostromo/integration/gut-metabolism-last-result.json /tmp/nostromo-gut-metabolism-last-result.json || true
          test -f nostromo/integration/gut-lineage-last-result.json && cp nostromo/integration/gut-lineage-last-result.json /tmp/nostromo-gut-lineage-last-result.json || true
          test -f nostromo/integration/vajra-dynamic-last-result.json && cp nostromo/integration/vajra-dynamic-last-result.json /tmp/nostromo-vajra-dynamic-last-result.json || true
          test -f nostromo/integration/vajra-conflict-last-result.json && cp nostromo/integration/vajra-conflict-last-result.json /tmp/nostromo-vajra-conflict-last-result.json || true
          test -f nostromo/integration/vajra-uncertainty-last-result.json && cp nostromo/integration/vajra-uncertainty-last-result.json /tmp/nostromo-vajra-uncertainty-last-result.json || true
          test -f nostromo/integration/shroom-feedback-last-result.json && cp nostromo/integration/shroom-feedback-last-result.json /tmp/nostromo-shroom-feedback-last-result.json || true
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/nostromo-formal-round-last-result.json ]; then
            cp /tmp/nostromo-formal-round-last-result.json nostromo/integration/formal-round-last-result.json
            git add nostromo/integration/formal-round-last-result.json
          fi
          if [ -f /tmp/nostromo-ci-last-result.json ]; then
            cp /tmp/nostromo-ci-last-result.json nostromo/integration/ci-last-result.json
            git add nostromo/integration/ci-last-result.json
          fi
          if [ -f /tmp/nostromo-muther-falsify-last-result.json ]; then
            cp /tmp/nostromo-muther-falsify-last-result.json nostromo/integration/muther-falsify-last-result.json
            git add nostromo/integration/muther-falsify-last-result.json
          fi
          if [ -f /tmp/nostromo-droplet-claim-verify-last-result.json ]; then
            cp /tmp/nostromo-droplet-claim-verify-last-result.json nostromo/integration/droplet-claim-verify-last-result.json
            git add nostromo/integration/droplet-claim-verify-last-result.json
          fi
          if [ -f /tmp/nostromo-gut-metabolism-last-result.json ]; then
            cp /tmp/nostromo-gut-metabolism-last-result.json nostromo/integration/gut-metabolism-last-result.json
            git add nostromo/integration/gut-metabolism-last-result.json
          fi
          if [ -f /tmp/nostromo-gut-lineage-last-result.json ]; then
            cp /tmp/nostromo-gut-lineage-last-result.json nostromo/integration/gut-lineage-last-result.json
            git add nostromo/integration/gut-lineage-last-result.json
          fi
          if [ -f /tmp/nostromo-vajra-dynamic-last-result.json ]; then
            cp /tmp/nostromo-vajra-dynamic-last-result.json nostromo/integration/vajra-dynamic-last-result.json
            git add nostromo/integration/vajra-dynamic-last-result.json
          fi
          if [ -f /tmp/nostromo-vajra-conflict-last-result.json ]; then
            cp /tmp/nostromo-vajra-conflict-last-result.json nostromo/integration/vajra-conflict-last-result.json
            git add nostromo/integration/vajra-conflict-last-result.json
          fi
          if [ -f /tmp/nostromo-vajra-uncertainty-last-result.json ]; then
            cp /tmp/nostromo-vajra-uncertainty-last-result.json nostromo/integration/vajra-uncertainty-last-result.json
            git add nostromo/integration/vajra-uncertainty-last-result.json
          fi
          if [ -f /tmp/nostromo-shroom-feedback-last-result.json ]; then
            cp /tmp/nostromo-shroom-feedback-last-result.json nostromo/integration/shroom-feedback-last-result.json
            git add nostromo/integration/shroom-feedback-last-result.json
          fi
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "[nostromo-test] record integration and executor results"
            git push origin HEAD:main
          fi
      - name: Enforce falsification executor conclusion
        if: steps.muther_falsify.outcome != 'success'
        run: exit 1
      - name: Enforce DROPLET claim verification conclusion
        if: steps.droplet_claim_verify.outcome != 'success'
        run: exit 1
      - name: Enforce GUT metabolism conclusion
        if: steps.gut_metabolism.outcome != 'success'
        run: exit 1
      - name: Enforce GUT lineage anti-echo conclusion
        if: steps.gut_lineage.outcome != 'success'
        run: exit 1
      - name: Enforce VAJRA dynamic dismantling conclusion
        if: steps.vajra_dynamic.outcome != 'success'
        run: exit 1
      - name: Enforce VAJRA conflict-preservation conclusion
        if: steps.vajra_conflict.outcome != 'success'
        run: exit 1
      - name: Enforce VAJRA uncertainty guard conclusion
        if: steps.vajra_uncertainty.outcome != 'success'
        run: exit 1
      - name: Enforce SHROOMING feedback-conditioning conclusion
        if: steps.shroom_feedback.outcome != 'success'
        run: exit 1
      - name: Enforce integration conclusion
        if: steps.integration.outcome != 'success'
        run: exit 1
