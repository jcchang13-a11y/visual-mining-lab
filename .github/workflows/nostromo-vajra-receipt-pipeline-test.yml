name: NOSTROMO VAJRA Receipt Pipeline Test

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/integration/vajra-receipt-pipeline.mjs'
      - 'nostromo/integration/vajra-receipt-pipeline-test.mjs'
      - '.github/workflows/nostromo-vajra-receipt-pipeline-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical bracket-aware receipt pipeline
        run: node nostromo/integration/vajra-receipt-pipeline-test.mjs
      - name: Persist focused evidence
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- nostromo/integration/vajra-receipt-pipeline-last-result.json)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nostromo/integration/vajra-receipt-pipeline-last-result.json
          git commit -m '[nostromo-test] VAJRA receipt pipeline focused evidence'
          git push
