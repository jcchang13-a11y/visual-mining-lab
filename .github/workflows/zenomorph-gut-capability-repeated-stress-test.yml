name: ZENOMORPH Repeated Capability Stress Test
on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/gut/capability-admission.mjs'
      - 'nostromo/gut/capability-sandbox.mjs'
      - 'nostromo/gut/capability-heldout-stress.mjs'
      - 'nostromo/gut/capability-repeated-stress.mjs'
      - 'nostromo/integration/gut-capability-repeated-stress-test.mjs'
      - '.github/workflows/zenomorph-gut-capability-repeated-stress-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[nostromo-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repeated selective held-out behavior profile
        run: node nostromo/integration/gut-capability-repeated-stress-test.mjs
      - name: Commit focused result
        if: always()
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          test -f nostromo/integration/gut-capability-repeated-stress-last-result.json && cp nostromo/integration/gut-capability-repeated-stress-last-result.json /tmp/repeated-heldout.json || true
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/repeated-heldout.json ]; then cp /tmp/repeated-heldout.json nostromo/integration/gut-capability-repeated-stress-last-result.json; git add nostromo/integration/gut-capability-repeated-stress-last-result.json; fi
          if git diff --cached --quiet; then echo "No result change"; else git commit -m "[nostromo-test] record ZENOMORPH repeated capability stress result"; git push origin HEAD:main; fi
