name: NOSTROMO GUT Symbol Thickening

on:
  push:
    branches: [ main ]
    paths:
      - '.nostromo-triggers/gut-symbol.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thicken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply GUT Symbol preservation patch
        run: node nostromo/integration/apply-gut-symbol-thickening.mjs
      - name: Verify focused Symbol adversarial case
        run: node nostromo/integration/gut-symbol-test.mjs
      - name: Verify existing GUT metabolism regression
        run: node nostromo/integration/gut-metabolism-test.mjs
      - name: Commit verified thickening
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nostromo/gut/gut-engine.js nostromo/integration/gut-metabolism-test.mjs nostromo/integration/gut-symbol-last-result.json nostromo/integration/gut-metabolism-last-result.json
          git commit -m "NOSTROMO: apply verified GUT v0.2.30 Symbol preservation"
          git pull --rebase origin main
          git push origin HEAD:main
