name: NOSTROMO VAJRA Nested Parenthetical Test

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/integration/vajra-ambiguity-guard.mjs'
      - 'nostromo/integration/vajra-nested-parenthetical-test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded nested-parenthetical scope containment
        run: node nostromo/integration/vajra-nested-parenthetical-test.mjs
      - name: Commit focused nested-parenthetical evidence
        run: |
          git config user.name "nostromo-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- nostromo/integration/vajra-nested-parenthetical-last-result.json)" ]; then
            echo "No result change"
          else
            git add nostromo/integration/vajra-nested-parenthetical-last-result.json
            git commit -m "[nostromo-test] record VAJRA nested-parenthetical evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
