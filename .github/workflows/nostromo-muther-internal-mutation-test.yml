name: NOSTROMO MUTHER Internal Mutation Test

on:
  push:
    paths:
      - 'nostromo/muther/**'
      - '.github/workflows/nostromo-muther-internal-mutation-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test provenance-bound internal mutation sandbox
        run: node nostromo/muther/internal-mutation.test.mjs
