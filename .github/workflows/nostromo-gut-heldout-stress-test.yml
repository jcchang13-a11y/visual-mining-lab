name: NOSTROMO GUT held-out stress test
on:
  push:
    paths:
      - 'nostromo/gut/capability-heldout-stress.mjs'
      - 'nostromo/gut/capability-sandbox.mjs'
      - '.github/workflows/nostromo-gut-heldout-stress-test.yml'
  workflow_dispatch:
jobs:
  heldout-cross-organ-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify held-out behavior change and fail-closed boundaries
        run: |
          node --input-type=module <<'EOF'
          import {runHeldoutCrossOrganStress} from './nostromo/gut/capability-heldout-stress.mjs';

          const candidate={adapterId:'foreign.signal',source:'fixture',permissions:['read'],interface:'signal'};
          const capabilityRegistry={'foreign.signal': input=>({flag:input.flag===true})};
          const organRegistry={VAJRA:({foreignSignal})=>({route:foreignSignal?.flag?'challenge':'hold'})};
          const opts={capabilityRegistry,organRegistry,downstreamOrganId:'VAJRA',context:{source:'fixture',provenanceFingerprint:'heldout-fixture-v1'}};

          const changed=runHeldoutCrossOrganStress(candidate,{flag:true,n:1},opts);
          if(changed.status!=='PASS'||changed.behaviorChanged!==true)throw new Error(JSON.stringify(changed));
          if(changed.assimilationStage!=='HELDOUT_BEHAVIOR_CHANGE_VERIFIED')throw new Error('wrong held-out stage');
          if(changed.bodyAdmission!==false||changed.installed!==false||changed.persistentMutation!==false)throw new Error('held-out gate lied about mutation boundary');
          if(changed.downstreamOrganId!=='VAJRA'||changed.downstreamExecuted!==true)throw new Error('downstream evidence missing');
          if(!changed.provenanceFingerprint)throw new Error('provenance fingerprint missing');
          if(typeof changed.rollbackEvidence!=='string'||changed.rollbackEvidence.length<10)throw new Error('rollback evidence missing');

          const noChange=runHeldoutCrossOrganStress(candidate,{flag:false,n:2},opts);
          if(noChange.status!=='HOLD'||noChange.behaviorChanged!==false||noChange.assimilationStage!=='HELDOUT_NO_BEHAVIOR_CHANGE')throw new Error('no-change control must HOLD');

          const missingOrgan=runHeldoutCrossOrganStress(candidate,{flag:true},{...opts,downstreamOrganId:'MISSING'});
          if(missingOrgan.status!=='BLOCKED'||missingOrgan.reason!=='host-registered-downstream-organ-required'||missingOrgan.downstreamExecuted!==false)throw new Error('missing organ must fail closed');

          const missingAdapter=runHeldoutCrossOrganStress({adapterId:'missing.signal',source:'fixture'},{flag:true},opts);
          if(missingAdapter.status!=='BLOCKED')throw new Error('missing adapter must fail closed');

          const asyncCapabilityRegistry={'foreign.signal': async input=>({flag:input.flag===true})};
          const asyncCapability=runHeldoutCrossOrganStress(candidate,{flag:true},{...opts,capabilityRegistry:asyncCapabilityRegistry});
          if(!['BLOCKED','QUARANTINE'].includes(asyncCapability.status))throw new Error('async capability must not pass');

          const asyncOrganRegistry={VAJRA:async ({foreignSignal})=>({route:foreignSignal?.flag?'challenge':'hold'})};
          const asyncOrgan=runHeldoutCrossOrganStress(candidate,{flag:true},{...opts,organRegistry:asyncOrganRegistry});
          if(asyncOrgan.status!=='QUARANTINE'||asyncOrgan.reason!=='async-downstream-organ-not-supported')throw new Error('async downstream organ must quarantine');

          console.log('PASS held-out cross-organ stress evidence gate',changed.provenanceFingerprint);
          EOF
