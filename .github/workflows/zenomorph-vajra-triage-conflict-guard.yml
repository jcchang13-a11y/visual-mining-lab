name: ZENOMORPH VAJRA Triage Conflict Guard

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/vajra/dynamic-decomposition.js'
      - 'nostromo/vajra/dynamic-decomposition-test.mjs'
      - '.github/workflows/zenomorph-vajra-triage-conflict-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify conflicting qualifying GUT triage cannot manufacture VAJRA certainty
        run: node nostromo/vajra/dynamic-decomposition-test.mjs
