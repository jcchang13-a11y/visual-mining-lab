name: ZENOMORPH GUT body accessor whole-body verify
on:
  push:
    branches:
      - 'zenomorph/gut-body-accessor-boundary'
    paths:
      - 'nostromo/gut/capability-incorporation.mjs'
      - '.github/workflows/nostromo-gut-capability-incorporation-test.yml'
      - '.github/workflows/zenomorph-gut-body-accessor-whole-body-verify.yml'
  workflow_dispatch:
jobs:
  whole-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run cross-organ regression and 50-round integration
        run: |
          node nostromo/integration/formal-round-test.mjs
          node nostromo/integration/muther-falsify-test.mjs
          node nostromo/integration/muther-repo-diversity-test.mjs
          node nostromo/integration/droplet-claim-verify-test.mjs
          node nostromo/integration/gut-metabolism-test.mjs
          node nostromo/integration/gut-ancestor-failure-test.mjs
          node nostromo/integration/gut-lineage-test.mjs
          node nostromo/integration/gut-callable-test.mjs
          node nostromo/integration/vajra-dynamic-test.mjs
          node nostromo/integration/vajra-conflict-test.mjs
          node nostromo/integration/vajra-ambiguity-test.mjs
          node nostromo/integration/vajra-conditional-prefix-test.mjs
          node nostromo/integration/vajra-attribution-test.mjs
          node nostromo/integration/vajra-bracket-scope-guard.mjs
          node nostromo/integration/vajra-uncertainty-test.mjs
          node nostromo/integration/vajra-conflict-escalation-test.mjs
          node nostromo/integration/vajra-provenance-diversity-test.mjs
          node nostromo/integration/vajra-context-conditioning-test.mjs
          node nostromo/integration/shroom-feedback-test.mjs
          node nostromo/integration/shroom-stateful-probe-test.mjs
          node nostromo/integration/ci-test.mjs
