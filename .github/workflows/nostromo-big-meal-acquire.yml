name: NOSTROMO Big Meal Acquisition Gate

on:
  push:
    paths:
      - 'nostromo/research/big-meals/**'
      - 'nostromo/integration/big-meal-acquire.mjs'
      - 'nostromo/integration/big-meal-acquire.test.mjs'
      - 'nostromo/integration/big-meal-runner.mjs'
      - 'nostromo/integration/big-meal-ablation-probe.mjs'
      - 'nostromo/integration/big-meal-ablation-probe.test.mjs'
      - 'nostromo/integration/big-meal-causal-runner.mjs'
      - 'nostromo/integration/big-meal-cross-food-robustness-runner.mjs'
      - 'nostromo/integration/big-meal-delayed-retest-runner.mjs'
      - 'nostromo/integration/big-meal-delayed-retest-runner.test.mjs'
      - 'nostromo/integration/big-meal-usefulness-gate.mjs'
      - 'nostromo/integration/big-meal-usefulness-gate.test.mjs'
      - 'nostromo/integration/big-meal-usefulness-runner.mjs'
      - 'nostromo/runtime/body-router.mjs'
      - '.github/workflows/nostromo-big-meal-acquire.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquisition-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test whole-food boundary
        run: node --test nostromo/integration/big-meal-acquire.test.mjs
      - name: Unit-test causal ablation bridge
        run: node --test nostromo/integration/big-meal-ablation-probe.test.mjs
      - name: Unit-test delayed retention identity gate
        run: node --test nostromo/integration/big-meal-delayed-retest-runner.test.mjs
      - name: Unit-test cross-food usefulness gate
        run: node --test nostromo/integration/big-meal-usefulness-gate.test.mjs
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Acquire, verify, and digest Pasquinelli through robust fallback path
        run: |
          node nostromo/integration/big-meal-runner.mjs --output=/tmp/pasquinelli-meal.json > /tmp/pasquinelli-meal.stdout
          node -e "const x=require('/tmp/pasquinelli-meal.json'); if(x.status!=='INGESTED_NOT_PROMOTED'||!x.provenance?.sourceSha256||x.promotion?.allowed!==false) process.exit(1); console.log(JSON.stringify({status:x.status,mealId:x.mealId,source:x.provenance.url,format:x.provenance.format,sourceSha256:x.provenance.sourceSha256,mutherChunkCount:x.muther?.chunkCount,promotion:x.promotion},null,2))"
      - name: Run live Pasquinelli to RFC 9110 causal ablation
        run: |
          node nostromo/integration/big-meal-causal-runner.mjs --output=/tmp/live-cross-food-causal.json > /tmp/live-cross-food-causal.stdout
          node -e "const x=require('/tmp/live-cross-food-causal.json'); if(x.stableUnchanged!==true||x.promotion?.promotable!==false||!x.receipt?.candidateId) process.exit(1); console.log(JSON.stringify({status:x.status,prior:x.prior,heldout:x.heldout,candidate:x.candidate,controlRoute:x.controlRoute,exposedRoute:x.exposedRoute,receipt:x.receipt,stableUnchanged:x.stableUnchanged,promotion:x.promotion},null,2))"
      - name: Run multi-food causal robustness probe
        run: |
          node nostromo/integration/big-meal-cross-food-robustness-runner.mjs --output=/tmp/cross-food-robustness.json > /tmp/cross-food-robustness.stdout
          node -e "const x=require('/tmp/cross-food-robustness.json'); if(x.stableUnchanged!==true||x.promotion?.promotable!==false||x.heldoutCount<2||!x.candidateId||x.sameCandidate!==true) process.exit(1); console.log(JSON.stringify({status:x.status,prior:x.prior,candidateId:x.candidateId,causalEffects:x.causalEffects,heldoutCount:x.heldoutCount,crossFoodCausalRobustness:x.crossFoodCausalRobustness,stableUnchanged:x.stableUnchanged,promotion:x.promotion,heldouts:x.heldouts.map(h=>({mealId:h.mealId,sourceSha256:h.sourceSha256,mutherChunkCount:h.mutherChunkCount,causalEffectObserved:h.receipt?.causalEffectObserved,stableUnchanged:h.stableUnchanged}))},null,2))"
      - name: Evaluate whether the cross-food effect is useful rather than merely different
        run: |
          node nostromo/integration/big-meal-usefulness-runner.mjs --input=/tmp/cross-food-robustness.json --output=/tmp/cross-food-usefulness.json > /tmp/cross-food-usefulness.stdout
          node -e "const x=require('/tmp/cross-food-usefulness.json'); if(x.stableUnchanged!==true||x.promotion?.promotable!==false||x.heldoutCount<2) process.exit(1); console.log(JSON.stringify({candidateId:x.candidateId,crossFoodUsefulnessPassed:x.crossFoodUsefulnessPassed,passedCount:x.passedCount,heldoutCount:x.heldoutCount,results:x.results,promotion:x.promotion},null,2))"
      - name: Run delayed cross-food retention retest against frozen prior identity
        run: |
          node nostromo/integration/big-meal-delayed-retest-runner.mjs \
            --expected-candidate=meal-topology-pasquinelli-2026-machine-organism-language-6fea27273abb \
            --expected-prior-sha256=f21717db8b1d43ccce72cd702322b393c2e54094dbbcff034afc7de85c480a79 \
            --output=/tmp/delayed-cross-food-retest.json > /tmp/delayed-cross-food-retest.stdout
          node -e "const x=require('/tmp/delayed-cross-food-retest.json'); if(x.stableUnchanged!==true||x.promotion?.promotable!==false||x.priorIdentityMatches!==true||x.candidateIdentityMatches!==true||x.sameCandidateAcrossHeldouts!==true||x.causalEffectRetained!==true||x.delayedRetentionPassed!==true||x.promotion?.delayed_retest!==true||x.heldouts?.length<2) process.exit(1); console.log(JSON.stringify({status:x.status,observedAt:x.observedAt,prior:x.prior,candidate:x.candidate,priorIdentityMatches:x.priorIdentityMatches,candidateIdentityMatches:x.candidateIdentityMatches,sameCandidateAcrossHeldouts:x.sameCandidateAcrossHeldouts,causalEffectRetained:x.causalEffectRetained,delayedRetentionPassed:x.delayedRetentionPassed,stableUnchanged:x.stableUnchanged,promotion:x.promotion,heldouts:x.heldouts},null,2))"
      - name: Preserve live causal receipts
        uses: actions/upload-artifact@v4
        with:
          name: zenomorph-live-cross-food-causal
          path: |
            /tmp/live-cross-food-causal.json
            /tmp/cross-food-robustness.json
            /tmp/cross-food-usefulness.json
            /tmp/delayed-cross-food-retest.json
          retention-days: 30
