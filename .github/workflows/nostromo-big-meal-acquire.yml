name: NOSTROMO Big Meal Acquisition Gate

on:
  push:
    paths:
      - 'nostromo/research/big-meals/**'
      - 'nostromo/integration/big-meal-acquire.mjs'
      - 'nostromo/integration/big-meal-acquire.test.mjs'
      - 'nostromo/integration/big-meal-runner.mjs'
      - 'nostromo/integration/big-meal-ablation-probe.mjs'
      - 'nostromo/integration/big-meal-ablation-probe.test.mjs'
      - 'nostromo/runtime/body-router.mjs'
      - '.github/workflows/nostromo-big-meal-acquire.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquisition-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test whole-food boundary
        run: node --test nostromo/integration/big-meal-acquire.test.mjs
      - name: Unit-test causal ablation bridge
        run: node --test nostromo/integration/big-meal-ablation-probe.test.mjs
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Acquire, verify, and digest Pasquinelli through robust fallback path
        run: |
          node nostromo/integration/big-meal-runner.mjs --output=/tmp/pasquinelli-meal.json > /tmp/pasquinelli-meal.stdout
          node -e "const x=require('/tmp/pasquinelli-meal.json'); if(x.status!=='INGESTED_NOT_PROMOTED'||!x.provenance?.sourceSha256||x.promotion?.allowed!==false) process.exit(1); console.log(JSON.stringify({status:x.status,mealId:x.mealId,source:x.provenance.url,format:x.provenance.format,sourceSha256:x.provenance.sourceSha256,mutherChunkCount:x.muther?.chunkCount,promotion:x.promotion},null,2))"
