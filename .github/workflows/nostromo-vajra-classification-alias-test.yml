# Evidence lifecycle accepts OPEN before promotion and CI-verified RESOLVED after promotion.
name: NOSTROMO VAJRA Classification Alias Test

on:
  push:
    branches: [ main ]
    paths:
      - 'nostromo/vajra/classification-alias-guard.js'
      - 'nostromo/vajra/classification-alias-guard-test.mjs'
      - 'nostromo/vajra/dynamic-decomposition.js'
      - 'nostromo/vajra/dynamic-decomposition-test.mjs'
      - 'nostromo/failure-log/2026-09-09-vajra-classification-alias-conflict-suppression.json'
      - 'nostromo/failure-log/2026-09-09-vajra-unauthorized-classification-alias-escape.json'
      - '.github/workflows/nostromo-vajra-classification-alias-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify classification alias conflict containment
        run: node nostromo/vajra/classification-alias-guard-test.mjs
      - name: Verify VAJRA dynamic decomposition regression
        run: node nostromo/vajra/dynamic-decomposition-test.mjs
      - name: Verify VAJRA multiparent regression
        run: node nostromo/vajra/dynamic-multiparent-test.mjs
      - name: Verify GUT cross-organ regression
        run: node nostromo/integration/gut-metabolism-test.mjs
      - name: Verify VAJRA cross-organ regression
        run: node nostromo/integration/vajra-dynamic-test.mjs
      - name: Verify failure evidence lifecycle
        run: |
          node - <<'NODE'
          const prior=require('./nostromo/failure-log/2026-09-09-vajra-classification-alias-conflict-suppression.json');
          if(prior.failureType!=='CLASSIFICATION_ALIAS_CONFLICT_SUPPRESSION') process.exit(1);
          if(prior.status!=='OPEN_NOT_PROMOTED'&&prior.status!=='RESOLVED_CI_VERIFIED') process.exit(1);
          if(prior.status==='RESOLVED_CI_VERIFIED') {
            if(prior.provenance?.focusedVerificationRun!==34349961048) process.exit(1);
            if(prior.provenance?.focusedVerificationConclusion!=='success') process.exit(1);
            if(prior.provenance?.fullIntegrationRun!==34349961006) process.exit(1);
            if(prior.provenance?.fullIntegrationConclusion!=='success') process.exit(1);
          }
          if(prior.provenance?.privateConnectorMaterialIncluded!==false) process.exit(1);

          const current=require('./nostromo/failure-log/2026-09-09-vajra-unauthorized-classification-alias-escape.json');
          if(current.failureType!=='UNAUTHORIZED_CLASSIFICATION_ALIAS_ESCAPE') process.exit(1);
          if(current.status!=='OPEN_NOT_PROMOTED'&&current.status!=='RESOLVED_CI_VERIFIED') process.exit(1);
          if(current.status==='RESOLVED_CI_VERIFIED') {
            if(current.provenance?.focusedVerificationRun!==34354717540) process.exit(1);
            if(current.provenance?.focusedVerificationConclusion!=='success') process.exit(1);
            if(current.provenance?.fullIntegrationRun!==34354717426) process.exit(1);
            if(current.provenance?.fullIntegrationConclusion!=='success') process.exit(1);
            if(current.provenance?.verifiedHeadSha!=='744eb7c77b392ec05e87cd741eb99b0e0fd9c85f') process.exit(1);
          }
          if(current.provenance?.privateConnectorMaterialIncluded!==false) process.exit(1);
          NODE
