(()=>{
const qs=s=>document.querySelector(s);const frames={station:qs('#station'),way:qs('#wayfinding'),dir:qs('#directoryFrame'),lobby:qs('#lobby'),car:qs('#car')};
function show(name){Object.values(frames).forEach(f=>f.classList.remove('on'));frames[name].classList.add('on');window.scrollTo(0,0)}
function rightSwipe(frame,next){let startX=null;frame.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});frame.addEventListener('touchend',e=>{if(startX!==null&&e.changedTouches[0].clientX-startX>45)show(next);startX=null},{passive:true});frame.addEventListener('wheel',e=>{if(e.deltaX< -20)show(next)},{passive:true})}
rightSwipe(frames.station,'way');rightSwipe(frames.way,'dir');
let dirTouchX=null;frames.dir.addEventListener('touchstart',e=>dirTouchX=e.touches[0].clientX,{passive:true});frames.dir.addEventListener('touchend',e=>{if(dirTouchX!==null&&e.changedTouches[0].clientX-dirTouchX>45)show('lobby');dirTouchX=null},{passive:true});frames.dir.addEventListener('wheel',e=>{if(e.deltaX< -20)show('lobby')},{passive:true});
let lobbyTouchX=null;frames.lobby.addEventListener('touchstart',e=>lobbyTouchX=e.touches[0].clientX,{passive:true});frames.lobby.addEventListener('touchend',e=>{if(lobbyTouchX!==null&&e.changedTouches[0].clientX-lobbyTouchX< -45)show('dir');lobbyTouchX=null},{passive:true});frames.lobby.addEventListener('wheel',e=>{if(e.deltaX>20)show('dir')},{passive:true});
const elevators=[['A','1號電梯','B1・1F–4F','open'],['B','2號電梯','B1・1F・5F–7F','open'],['E','3號電梯','B1・1F・8F–15F','resident'],['C','4號電梯','B1・1F・16F–22F','resident'],['D','5號電梯','B5–22F','freight']];
let group='A',tripCount=0,lastFloor='B1';const groups={A:{title:'1號電梯',floors:['4','3','2','1','B1']},B:{title:'2號電梯',floors:['7','6','5','1','B1']},C:{title:'4號電梯',floors:['22','21','20','19','18','17','16','1','B1']},E:{title:'3號電梯',floors:['15','14','13','12','11','10','9','8','1','B1']},D:{title:'5號電梯',floors:['22','21','20','19','18','17','16','15','14','13','12','11','10','9','8','7A','7','6','5','4','3','2','1','B1','B2','B3','B4','B5']}};const labels={B5:'停車場',B4:'停車場',B3:'停車場',B2:'停車場',B1:'捷運／停車',1:'金鑽廣場',2:'金鑽廣場',3:'金鑽廣場',4:'金鑽廣場',5:'商務辦公',6:'商務辦公',7:'商務辦公',8:'社會住宅',9:'社會住宅',10:'社會住宅',11:'社會住宅',12:'社會住宅',13:'社會住宅',14:'社會住宅',15:'社會住宅',16:'住宅',17:'住宅',18:'住宅',19:'住宅',20:'住宅',21:'住宅',22:'住宅'};
function renderHall(){qs('#doors').innerHTML=elevators.map(d=>{const freight=d[3]==='freight';const resident=d[3]==='resident';return `<button class="lift-door ${resident?'resident':''} ${freight?'freight':''}" data-group="${d[0]}"><h2>${d[1]}</h2>${freight?'<span class="freight-warning">物流專用・乘客請勿搭乘</span>':''}<p>${d[2]}</p></button>`}).join('')}
qs('#doors').addEventListener('click',e=>{const d=e.target.closest('[data-group]');if(!d)return;group=d.dataset.group;if(group==='C'||group==='E'){alert('住戶專用，需使用住戶門禁卡。');return}enterCar()});
const buttons=qs('#buttons'),display=qs('#display'),status=qs('#status'),arrival=qs('#arrival'),liftBox=qs('#liftBox');function enterCar(){qs('#groupTitle').textContent=groups[group].title;qs('#carGroupLabel').textContent=groups[group].title;renderPanel();show('car')}function renderPanel(){buttons.innerHTML='';groups[group].floors.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='floorbtn';b.dataset.floor=f;b.innerHTML=`${f}${labels[f]?`<small>${labels[f]}</small>`:''}`;buttons.appendChild(b)});status.textContent=`${lastFloor} · ${groups[group].title}`;display.textContent=lastFloor;arrival.classList.remove('show')}
function goFloor(f){tripCount++;arrival.classList.remove('show');status.textContent=`${f} · MOVING`;liftBox.classList.add('glitch');setTimeout(()=>liftBox.classList.remove('glitch'),350);if(group==='D'&&f==='7A'){display.textContent='7A';status.textContent='7A · DOORS OPEN';setTimeout(()=>location.href='./7a/',500);return}if(f==='3'){display.textContent='3';lastFloor='3';status.textContent='3 · DOORS OPEN';setTimeout(()=>location.href='../',500);return}if(group==='E'&&((['1','B1'].includes(lastFloor)&&f==='8')||(lastFloor==='8'&&['1','B1'].includes(f)))&&tripCount%2===0){display.textContent='7A';status.textContent='…';setTimeout(()=>showArrival('7A','門只開了兩秒。外面有燈，但沒有樓層牌。'),520);setTimeout(()=>{arrival.classList.remove('show');display.textContent=f;status.textContent=`${f} · DOORS OPEN`;showFloor(f);lastFloor=f},2300);return}setTimeout(()=>{display.textContent=f;lastFloor=f;status.textContent=`${f} · DOORS OPEN`;showFloor(f)},420)}function showArrival(f,text){arrival.innerHTML=`<h2>${f}</h2><p>${text}</p>`;arrival.classList.add('show')}function showFloor(f){let desc='本層尚未開放。';if(['B2','B3','B4','B5'].includes(f))desc='地下停車場。';if(f==='B1')desc='捷運連通、電梯廳與停車場。';if(['1','2','3','4'].includes(f))desc='金鑽廣場。';if(['5','6','7'].includes(f))desc='商務辦公空間。';if(Number(f)>=8&&Number(f)<=15)desc='社會住宅。';if(Number(f)>=16&&Number(f)<=22)desc='帝景天下住宅區。';if(f==='8'&&group==='D')desc='「剛吃飽」。';arrival.innerHTML=`<h2>${f}${labels[f]?' · '+labels[f]:''}</h2><p>${desc}</p>`;arrival.classList.add('show')}
buttons.addEventListener('click',e=>{const b=e.target.closest('[data-floor]');if(b)goFloor(b.dataset.floor)});qs('#doorOpen').addEventListener('click',()=>{arrival.classList.remove('show');const exits=['lobby','station','7a','other','blank'];const exit=exits[Math.floor(Math.random()*exits.length)];status.textContent='… · DOORS OPEN';if(exit==='lobby'){setTimeout(()=>show('lobby'),260);return}if(exit==='station'){setTimeout(()=>show('station'),260);return}if(exit==='7a'){setTimeout(()=>location.href='./7a/',300);return}if(exit==='other'){showArrival('彼岸','');return}showArrival('—','門已開啟。外面沒有樓層牌。')});qs('#doorClose').addEventListener('click',()=>{arrival.classList.remove('show');status.textContent=`${lastFloor} · DOORS CLOSED`});qs('#emergencyCall').addEventListener('click',()=>{status.textContent='緊急呼叫中… 管理室';setTimeout(()=>{status.textContent='管理室已接通，請靠近麥克風說話。'},700)});renderHall();
})();
</script>
</body>
</html>
