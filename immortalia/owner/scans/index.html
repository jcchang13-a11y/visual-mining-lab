<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>掃描紀錄 · 島主室</title>
<style>
:root{--bg:#f4eedf;--ink:#17130f;--muted:#6c5e4d;--line:rgba(23,19,15,.25);--red:#7a2f2a;--paper:rgba(255,252,244,.84)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.wrap{width:min(100%,860px);margin:auto;padding:28px 18px 48px}.eyebrow{font-size:.68rem;letter-spacing:.16em;color:var(--muted)}h1{font-size:clamp(2rem,9vw,4.8rem);font-weight:500;margin:8px 0 24px}.panel{background:var(--paper);border:1px solid var(--line);padding:18px;margin-bottom:16px}.panel h2{font-size:1.25rem;font-weight:500;margin:0 0 12px}.empty{font-size:.86rem;line-height:1.75;color:var(--muted)}.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.legend div{padding:12px;border-top:1px solid var(--line);font-size:.78rem;line-height:1.6}.legend strong{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--red);margin-bottom:4px}.archive{margin-top:20px;border-top:1px solid var(--line)}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted)}.back{display:inline-block;margin-top:22px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:.78rem;padding-bottom:2px}.locked{display:none}@media(max-width:620px){.legend{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap" id="content">
<div class="eyebrow">IMMORTALIA · OWNER CONSOLE</div>
<h1>掃描紀錄</h1>
<section class="panel">
<h2>最新一次</h2>
<div class="empty">掃描器尚未正式接線。接線完成後，這裡會固定顯示最近一次「關聯發現＋能力配對」的結果。</div>
<div class="legend"><div><strong>關聯發現</strong>A 跟 B 為什麼有關：文本、概念、敘事、圖像、結構、對照或矛盾。</div><div><strong>能力配對</strong>A 可以拿去幫 B 做什麼：閱讀、分析、生成、出版、調度或新的實驗流程。</div></div>
</section>
<section class="panel">
<h2>歷史巡檢</h2>
<div class="archive"><div class="row"><span>尚無正式掃描紀錄</span><span>—</span></div></div>
</section>
<a class="back" href="../">← 返回島主室</a>
</main>
<script>
if(sessionStorage.getItem('immortalia-owner-auth')!=='ok'){document.documentElement.innerHTML='';location.replace('../');}
</script>
</body></html>
