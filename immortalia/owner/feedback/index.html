<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>島主回饋 · IMMORTALIA</title><style>
:root{--bg:#f4eedf;--ink:#17130f;--muted:#6c5e4d;--line:rgba(23,19,15,.25);--red:#7a2f2a;--paper:rgba(255,252,244,.88)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.wrap{width:min(100%,760px);margin:auto;padding:28px 18px 48px}.eyebrow{font-size:.68rem;letter-spacing:.16em;color:var(--muted)}h1{font-size:clamp(2rem,9vw,4.5rem);font-weight:500;margin:8px 0 20px}.panel{background:var(--paper);border:1px solid var(--line);padding:18px;margin-bottom:16px}.panel h2{font-size:1.2rem;font-weight:500;margin:0 0 10px}.hint{font-size:.8rem;line-height:1.65;color:var(--muted)}textarea,select,input{width:100%;border:1px solid var(--line);background:#fffaf0;color:var(--ink);padding:11px;font:inherit;margin-top:10px}textarea{min-height:130px;resize:vertical}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}button{padding:11px;border:1px solid var(--ink);background:var(--ink);color:#fffaf0;font:inherit}.secondary{background:transparent;color:var(--ink)}.log{font-size:.78rem;line-height:1.65;color:var(--muted);white-space:pre-wrap}.back{display:inline-block;margin-top:8px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:.78rem}.status{margin-top:10px;font-size:.75rem;color:var(--red)}@media(max-width:560px){.buttons{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div class="eyebrow">IMMORTALIA · OWNER CONSOLE</div><h1>島主回饋</h1>
<section class="panel"><h2>全局指令／單一實驗回饋</h2><div class="hint">從掃描紀錄點進來時，動作與對象會自動帶入。資料只存在這台瀏覽器，不會公開上網。</div><select id="action"><option>繼續實驗</option><option>批准量產</option><option>修改後再試</option><option>停止</option><option>全局偏好</option></select><input id="target" placeholder="對象（可留空，例如：媒文化 × 剛吃飽）"><textarea id="text" placeholder="直接講人話就好，例如：第二個方向可以，少一點學術味，照這個再跑一輪。"></textarea><div class="buttons"><button id="save">存入回饋匣</button><button id="copy" class="secondary">複製給 EVA</button></div><div class="status" id="status"></div></section>
<section class="panel"><h2>待送回 EVA</h2><div class="hint">目前網站本身不能直接把文字送進這個 ChatGPT 對話；因此第一版採「本機保存＋一鍵複製」。之後接真正的私人後端，再改成直接送出。</div><div class="log" id="log">尚無回饋。</div><div class="buttons"><button id="copyAll" class="secondary">複製全部</button><button id="clear" class="secondary">清空</button></div></section>
<a class="back" href="../">← 返回島主室</a></main><script>
if(sessionStorage.getItem('immortalia-owner-auth')!=='ok'){document.documentElement.innerHTML='';location.replace('../');}
const KEY='immortalia-owner-feedback-v1';const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);if(qs.get('action'))$('action').value=qs.get('action');if(qs.get('target'))$('target').value=qs.get('target');
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function write(v){localStorage.setItem(KEY,JSON.stringify(v))}function format(x){return `[${x.time}] ${x.action}${x.target?'｜'+x.target:''}\n${x.text}`}
function render(){const a=read();$('log').textContent=a.length?a.map(format).join('\n\n'):'尚無回饋。'}
$('save').onclick=()=>{const text=$('text').value.trim();if(!text){$('status').textContent='先寫一句回饋。';return}const a=read();a.unshift({time:new Date().toLocaleString('zh-TW'),action:$('action').value,target:$('target').value.trim(),text});write(a.slice(0,50));$('text').value='';$('status').textContent='已存進本機回饋匣。';render()};
async function copyText(t){await navigator.clipboard.writeText(t);$('status').textContent='已複製，直接貼回目前 ChatGPT 對話即可。'}
$('copy').onclick=async()=>{const text=$('text').value.trim();if(!text){$('status').textContent='先寫一句回饋。';return}await copyText(`島主回饋｜${$('action').value}${$('target').value.trim()?'｜'+$('target').value.trim():''}\n${text}`)};
$('copyAll').onclick=async()=>{const a=read();if(a.length)await copyText('島主回饋匣：\n\n'+a.map(format).join('\n\n'))};$('clear').onclick=()=>{if(confirm('清空本機回饋匣？')){write([]);render()}};render();
</script></body></html>
