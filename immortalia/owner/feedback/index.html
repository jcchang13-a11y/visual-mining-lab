<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EVA TERMINAL · IMMORTALIA</title><style>
:root{--bg:#060a0e;--panel:#0b1117;--ink:#dbe6ed;--muted:#74828d;--line:#22303a;--accent:#91adbf;--hot:#c8d8e2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#05080b,#081018);color:var(--ink);font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.wrap{width:min(100%,860px);margin:auto;padding:28px 18px 48px}.eyebrow{font:600 .63rem/1 Arial,sans-serif;letter-spacing:.25em;color:var(--accent)}h1{font-size:clamp(2.2rem,9vw,4.8rem);font-weight:400;margin:12px 0 10px}.sub{font-size:.78rem;line-height:1.7;color:var(--muted);margin-bottom:18px}.panel{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:14px}.panel h2{font-size:1.05rem;font-weight:400;margin:0 0 10px}.context{font:500 .74rem/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#8ea0ad;white-space:pre-wrap;min-height:62px}.terminal{border:1px solid var(--line);background:#05090d}.screen{min-height:220px;max-height:45vh;overflow:auto;padding:16px;border-bottom:1px solid var(--line)}.msg{padding:9px 0;border-bottom:1px solid rgba(34,48,58,.55);font-size:.78rem;line-height:1.7}.msg:last-child{border-bottom:0}.who{font:600 .61rem/1 Arial,sans-serif;letter-spacing:.14em;color:var(--accent);margin-bottom:5px}.composer{padding:14px}.composer textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #293844;background:#020609;color:var(--ink);padding:11px;font:inherit;outline:none}.composer textarea:focus{border-color:#708a9c}.row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.row select{border:1px solid #293844;background:#05090d;color:var(--ink);padding:10px}.row button,.actions button,.actions a{padding:10px 12px;border:1px solid #78909f;background:#c5d3dc;color:#071018;font:600 .72rem/1 Arial,sans-serif;letter-spacing:.06em;text-decoration:none;text-align:center}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.secondary{background:transparent!important;color:#afc0cb!important}.note{font-size:.73rem;line-height:1.7;color:var(--muted);margin-top:10px}.status{min-height:1.2em;margin-top:9px;font-size:.7rem;color:#9ab3c2}.back{display:inline-block;margin-top:8px;color:#74838e;text-decoration:none;font-size:.7rem;letter-spacing:.1em}@media(max-width:560px){.row,.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">IMMORTALIA · LEVEL 0 · EVA TERMINAL</div><h1>EVA TERMINAL</h1><div class="sub">掃描結果、實驗回饋與全局指令的對話節點。</div>
<section class="panel"><h2>ACTIVE CONTEXT</h2><div class="context" id="context">LOADING EVA MEMORY…</div></section>
<section class="terminal"><div class="screen" id="screen"><div class="msg"><div class="who">SYSTEM</div>正在載入歸墟／Immortalia 的 EVA 記憶核心。</div></div><div class="composer"><textarea id="text" placeholder="直接對 EVA 說話，例如：第二個實驗不錯，照這個方向再跑一輪。"></textarea><div class="row"><select id="action"><option>一般對話</option><option>繼續實驗</option><option>批准量產</option><option>修改後再試</option><option>停止</option><option>全局偏好</option></select><button id="queue">QUEUE MESSAGE</button></div><div class="actions"><button id="handoff">COPY + OPEN CHATGPT</button><button id="clear" class="secondary">CLEAR TERMINAL</button></div><div class="note">目前仍是安全轉接模式；不同的是，每次轉接都會先附上站內記憶核心與近期施工狀態，再附上你的終端訊息。</div><div class="status" id="status"></div></div></section>
<a class="back" href="../">← CONTROL LEVEL 0</a></main><script>
if(sessionStorage.getItem('immortalia-owner-auth')!=='ok'){document.documentElement.innerHTML='';location.replace('../');}
const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);const target=qs.get('target')||'';const presetAction=qs.get('action')||'';const KEY='immortalia-eva-terminal-v1';const MEMORY_URL='../eva-context.json';let evaMemory=null;
if(presetAction&&[...$('action').options].some(o=>o.value===presetAction))$('action').value=presetAction;
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function write(v){localStorage.setItem(KEY,JSON.stringify(v))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function contextLabel(){const lines=[target?`TARGET / ${target}`:'TARGET / GENERAL'];if(evaMemory){lines.push(`MEMORY / ${evaMemory.name||'EVA CONTEXT'}`);lines.push(`VERSION / ${evaMemory.version||'unknown'}`);lines.push(`CORE / ${(evaMemory.core||[]).length} items · RULES / ${(evaMemory.working_rules||[]).length} · RECENT / ${(evaMemory.recent||[]).length}`)}else lines.push('MEMORY / unavailable');return lines.join('\n')}
function render(){const a=read();const memoryState=evaMemory?'EVA 記憶核心已載入。轉接時會自動附帶共同世界設定、工作規則與近期施工狀態。':'EVA 記憶核心目前未載入；轉接仍可使用，但不會假裝有完整背景。';const base=`<div class="msg"><div class="who">SYSTEM</div>${memoryState}<br>目前仍是安全轉接模式；真正站內即時模型後端尚未接入。</div>`;$('screen').innerHTML=base+a.slice().reverse().map(x=>`<div class="msg"><div class="who">OPERATOR · ${x.action}</div>${escapeHtml(x.text)}${x.target?`<div class="note">TARGET / ${escapeHtml(x.target)}</div>`:''}</div>`).join('');$('screen').scrollTop=$('screen').scrollHeight;$('context').textContent=contextLabel()}
async function loadMemory(){try{const r=await fetch(MEMORY_URL,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);evaMemory=await r.json();$('status').textContent='EVA MEMORY ONLINE'}catch(e){evaMemory=null;$('status').textContent='EVA MEMORY UNAVAILABLE'}render()}
function memoryPayload(){if(!evaMemory)return'[[EVA MEMORY FILE UNAVAILABLE — do not invent missing background]]';const parts=['EVA PERSISTENT CONTEXT',`NAME: ${evaMemory.name||''}`,`VERSION: ${evaMemory.version||''}`,'','CORE MEMORY:',...(evaMemory.core||[]).map((x,i)=>`${i+1}. ${x}`),'','WORKING RULES:',...(evaMemory.working_rules||[]).map((x,i)=>`${i+1}. ${x}`),'','RECENT STATE:',...(evaMemory.recent||[]).map((x,i)=>`${i+1}. ${x}`)];return parts.join('\n')}
$('queue').onclick=()=>{const text=$('text').value.trim();if(!text){$('status').textContent='MESSAGE REQUIRED';return}const a=read();a.unshift({time:new Date().toISOString(),action:$('action').value,target,text});write(a.slice(0,60));$('text').value='';$('status').textContent='MESSAGE QUEUED LOCALLY';render()};
async function handoff(){let a=read();const live=$('text').value.trim();if(live)a.unshift({time:new Date().toISOString(),action:$('action').value,target,text:live});if(!a.length){$('status').textContent='NO MESSAGE TO SEND';return}if(!evaMemory)await loadMemory();const payload=['EVA TERMINAL HANDOFF','You are continuing an existing long-term collaboration. Read the persistent context below before answering the operator. Treat it as background context, not as a request to repeat it.',target?`CURRENT TARGET: ${target}`:'CURRENT TARGET: GENERAL','',memoryPayload(),'','TERMINAL MESSAGES:',...a.slice(0,12).reverse().map(x=>`${x.action}${x.target?'｜'+x.target:''}\n${x.text}`)].join('\n\n');try{await navigator.clipboard.writeText(payload);$('status').textContent=evaMemory?'MEMORY + MESSAGES COPIED · OPENING CHATGPT':'MESSAGES COPIED · MEMORY UNAVAILABLE';window.open('https://chatgpt.com/','_blank','noopener')}catch{$('status').textContent='COPY FAILED · 請手動複製'}}$('handoff').onclick=handoff;$('clear').onclick=()=>{if(confirm('清空 EVA TERMINAL 本機草稿？')){write([]);$('text').value='';render()}};loadMemory();
</script></body></html>
