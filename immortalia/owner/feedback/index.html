<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPERATOR INPUT · IMMORTALIA</title><style>
:root{--bg:#060a0e;--panel:#0b1117;--ink:#dbe6ed;--muted:#74828d;--line:#22303a;--accent:#91adbf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#05080b,#081018);color:var(--ink);font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.wrap{width:min(100%,780px);margin:auto;padding:28px 18px 48px}.eyebrow{font:600 .63rem/1 Arial,sans-serif;letter-spacing:.25em;color:var(--accent)}h1{font-size:clamp(2.2rem,9vw,4.6rem);font-weight:400;margin:12px 0 22px}.panel{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:14px}.panel h2{font-size:1.15rem;font-weight:400;margin:0 0 10px}.hint{font-size:.76rem;line-height:1.7;color:var(--muted)}textarea,select,input{width:100%;border:1px solid #293844;background:#05090d;color:var(--ink);padding:11px;font:inherit;margin-top:10px;outline:none}textarea:focus,select:focus,input:focus{border-color:#708a9c}textarea{min-height:140px;resize:vertical}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}button{padding:11px;border:1px solid #7c94a4;background:#c5d3dc;color:#071018;font:600 .78rem/1 Arial,sans-serif;letter-spacing:.05em}.secondary{background:transparent;color:#afc0cb}.log{font:500 .74rem/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#83929d;white-space:pre-wrap}.back{display:inline-block;margin-top:8px;color:#74838e;text-decoration:none;font-size:.7rem;letter-spacing:.1em}.status{margin-top:10px;font-size:.72rem;color:#9ab3c2}@media(max-width:560px){.buttons{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">IMMORTALIA · LEVEL 0 · OPERATOR INPUT</div><h1>指令回饋</h1><section class="panel"><h2>指令輸入</h2><div class="hint">可針對單一實驗，也可輸入全局工作偏好。從掃描紀錄進來時，動作與對象會自動帶入。</div><select id="action"><option>繼續實驗</option><option>批准量產</option><option>修改後再試</option><option>停止</option><option>全局偏好</option></select><input id="target" placeholder="對象（可留空，例如：媒文化 × 剛吃飽）"><textarea id="text" placeholder="直接講人話就好。"></textarea><div class="buttons"><button id="save">STORE INPUT</button><button id="copy" class="secondary">COPY TO EVA</button></div><div class="status" id="status"></div></section><section class="panel"><h2>本機輸入緩衝區</h2><div class="hint">目前只存在這台瀏覽器。網站還不能直接把文字送進目前的 ChatGPT 對話。</div><div class="log" id="log">尚無回饋。</div><div class="buttons"><button id="copyAll" class="secondary">COPY ALL</button><button id="clear" class="secondary">CLEAR BUFFER</button></div></section><a class="back" href="../">← CONTROL LEVEL 0</a></main><script>
if(sessionStorage.getItem('immortalia-owner-auth')!=='ok'){document.documentElement.innerHTML='';location.replace('../');}const KEY='immortalia-owner-feedback-v1';const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);if(qs.get('action'))$('action').value=qs.get('action');if(qs.get('target'))$('target').value=qs.get('target');function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function write(v){localStorage.setItem(KEY,JSON.stringify(v))}function format(x){return `[${x.time}] ${x.action}${x.target?'｜'+x.target:''}\n${x.text}`}function render(){const a=read();$('log').textContent=a.length?a.map(format).join('\n\n'):'尚無回饋。'}$('save').onclick=()=>{const text=$('text').value.trim();if(!text){$('status').textContent='INPUT REQUIRED';return}const a=read();a.unshift({time:new Date().toLocaleString('zh-TW'),action:$('action').value,target:$('target').value.trim(),text});write(a.slice(0,50));$('text').value='';$('status').textContent='INPUT STORED LOCALLY';render()};async function copyText(t){await navigator.clipboard.writeText(t);$('status').textContent='COPIED · 貼回目前 ChatGPT 對話即可'}$('copy').onclick=async()=>{const text=$('text').value.trim();if(!text){$('status').textContent='INPUT REQUIRED';return}await copyText(`OPERATOR INPUT｜${$('action').value}${$('target').value.trim()?'｜'+$('target').value.trim():''}\n${text}`)};$('copyAll').onclick=async()=>{const a=read();if(a.length)await copyText('OPERATOR INPUT BUFFER：\n\n'+a.map(format).join('\n\n'))};$('clear').onclick=()=>{if(confirm('清空本機輸入緩衝區？')){write([]);render()}};render();</script></body></html>
