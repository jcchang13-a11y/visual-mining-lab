<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#071018">
<title>IMMORTALIA · CLOSED FOR RECONSTRUCTION</title>
<style>
:root{--bg:#071018;--ink:#dce7ef;--muted:#7d8b96;--line:#22303a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#05080b 0%,#091018 54%,#060a0e 100%)}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.panel{width:min(100%,760px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:38px 0 34px}
.code{font:600 .65rem/1.2 Arial,sans-serif;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
h1{font-weight:400;font-size:clamp(2.7rem,11vw,6.5rem);line-height:.95;letter-spacing:.01em;margin:18px 0 18px}
p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.8;letter-spacing:.06em}
.status{margin-top:26px;font:500 .7rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#91adbf;letter-spacing:.08em}
.status::before{content:"● ";color:#91adbf}
</style>
</head>
<body>
<main><section class="panel" aria-label="Site closed for reconstruction">
<div class="code">IMMORTALIA · PUBLIC ACCESS SUSPENDED</div>
<h1>蓬萊仙島<br>暫停開放</h1>
<p>網站整修中。重新開放時間另行公告。</p>
<div class="status">RECONSTRUCTION IN PROGRESS / PUBLIC ACCESS OFFLINE</div>
</section></main>
</body>
</html>
